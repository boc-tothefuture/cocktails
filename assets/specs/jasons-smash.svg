      <rect x="95.8" y="219.4" width="42.0" height="42.0" rx="1.5" transform="rotate(-5 116.8 240.4)" fill="black"/><rect x="105.8" y="265.4" width="38.0" height="38.0" rx="1.5" transform="rotate(7 124.8 284.4)" fill="black"/>
    </mask>
