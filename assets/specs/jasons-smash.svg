  <rect x="14" y="14" width="392" height="432" rx="8" fill="none" stroke="#e8c59e" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Proportional Patterned Liquid Layers (Clipped to Glass & Masked Around Ice) -->
  <g clip-path="url(#glass-clip-archive-jasons-smash)">
    <g mask="url(#ice-mask-archive-jasons-smash)">
      <rect x="40" y="286.75" width="240" height="59.25" fill="url(#pat-archive-jasons-smash-0)"/><line x1="40" y1="286.75" x2="280" y2="286.75" stroke="#e08c38" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="264.54" width="240" height="22.22" fill="url(#pat-archive-jasons-smash-1)"/><line x1="40" y1="264.54" x2="280" y2="264.54" stroke="#e8c86b" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="246.02" width="240" height="18.51" fill="url(#pat-archive-jasons-smash-2)"/><line x1="40" y1="246.02" x2="280" y2="246.02" stroke="#d68a3e" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="216.40" width="240" height="29.62" fill="url(#pat-archive-jasons-smash-3)"/><line x1="40" y1="216.40" x2="280" y2="216.40" stroke="#dfd2c0" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    <rect x="95.8" y="219.4" width="42.0" height="42.0" rx="1.5" transform="rotate(-5 116.8 240.4)" fill="#110c0a" fill-opacity="0.25" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.22"/><rect x="105.8" y="265.4" width="38.0" height="38.0" rx="1.5" transform="rotate(7 124.8 284.4)" fill="#110c0a" fill-opacity="0.25" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.22"/>
  </g>

  <!-- Minimalist Open-Top Glass Silhouette -->
  <path d="M 77.0 184.0 L 98.0 347.0 Q 98.0 351.0 103.0 351.0 L 201.0 351.0 Q 206.0 351.0 206.0 347.0 L 227.0 184.0" fill="none" stroke="#d8c7b4" stroke-width="2" stroke-linecap="round"/>

