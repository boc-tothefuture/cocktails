<pattern id="pat-archive-jasons-smash-1" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e8c86b" fill-opacity="0.10"/><line x1="1.5" y1="5.5" x2="5.5" y2="1.5" stroke="#e8c86b" stroke-width="1.1" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-jasons-smash-2" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#d68a3e" fill-opacity="0.12"/><line x1="1.5" y1="2" x2="5.5" y2="2" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.85" stroke-linecap="round"/><line x1="5.5" y1="5" x2="9" y2="5" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.85" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-jasons-smash-3" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#dfd2c0" fill-opacity="0.07"/><circle cx="3.5" cy="8.5" r="1.7" fill="none" stroke="#dfd2c0" stroke-width="0.95" stroke-opacity="0.78"/><circle cx="9" cy="4" r="1.2" fill="none" stroke="#dfd2c0" stroke-width="0.9" stroke-opacity="0.7"/><circle cx="6.5" cy="10.5" r="0.7" fill="#dfd2c0" fill-opacity="0.65"/></pattern>
  </defs>

  <!-- Subterranean Speakeasy Blueprint Canvas -->
