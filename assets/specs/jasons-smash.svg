  <g stroke="#c95959" stroke-width="1.4" fill="none"><line x1="154.0" y1="228.4" x2="186.0" y2="190.4" stroke="#d8c7b4" stroke-width="1.2"/><circle cx="186.0" cy="190.4" r="2" fill="#d8c7b4" stroke="none"/><circle cx="168.0" cy="212.4" r="6.5" fill="#180d0d" stroke="#c95959" stroke-width="1.5"/></g>
<g fill="none" stroke="#86b478" stroke-width="1.35" stroke-linecap="round"><path d="M 132.0 232.4 Q 124.0 207.4 116.0 184.4"/><path d="M 128.0 218.4 C 118.0 214.4, 118.0 208.4, 127.0 210.4"/><path d="M 128.0 218.4 C 136.0 212.4, 136.0 206.4, 127.0 210.4"/><path d="M 123.0 204.4 C 113.0 200.4, 113.0 194.4, 122.0 197.4"/><path d="M 123.0 204.4 C 131.0 198.4, 131.0 192.4, 122.0 197.4"/><path d="M 119.0 192.4 C 110.0 188.4, 112.0 182.4, 118.0 186.4"/></g>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="223.9,231.2 234.0,231.2 240.0,231.2" fill="none" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="223.9" cy="231.2" r="1.5" fill="#dfd2c0"/><text x="245.0" y="234.2" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1" fill="#dfd2c0" font-weight="600">1 oz</tspan> <tspan fill="#c7b9ab">Lime Club Soda</tspan></text></g><g class="spec-svg-callout"><polyline points="220.8,255.3 234.0,255.3 240.0,255.3" fill="none" stroke="#d68a3e" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="220.8" cy="255.3" r="1.5" fill="#d68a3e"/><text x="245.0" y="258.3" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.625" fill="#d68a3e" font-weight="600">0.625 oz</tspan> <tspan fill="#c7b9ab">Simple syrup</tspan></text></g><g class="spec-svg-callout"><polyline points="218.1,275.6 234.0,275.6 240.0,275.6" fill="none" stroke="#e8c86b" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="218.1" cy="275.6" r="1.5" fill="#e8c86b"/><text x="245.0" y="278.6" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.75" fill="#e8c86b" font-weight="600">0.75 oz</tspan> <tspan fill="#c7b9ab">Fresh lime juice</tspan></text></g><g class="spec-svg-callout"><polyline points="212.8,316.4 234.0,316.4 240.0,316.4" fill="none" stroke="#e08c38" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="212.8" cy="316.4" r="1.5" fill="#e08c38"/><text x="245.0" y="319.4" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="2" fill="#e08c38" font-weight="600">2 oz</tspan> <tspan fill="#c7b9ab">Straight bourbon</tspan></text></g>
</svg>