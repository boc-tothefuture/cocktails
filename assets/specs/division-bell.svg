<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="100%" height="100%" class="cocktail-spec-svg" role="img" aria-label="Division Bell proportional build diagram">
  <defs>
    <radialGradient id="bg-glow-archive-division-bell" cx="38%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#1d1511"/>
      <stop offset="65%" stop-color="#110c0a"/>
      <stop offset="100%" stop-color="#090605"/>
    </radialGradient>
    <clipPath id="glass-clip-archive-division-bell">
      <path d="M 78.0 176.0 C 78.0 228.0, 110.0 266.0, 152.0 266.0 C 194.0 266.0, 226.0 228.0, 226.0 176.0 Z"/>
    </clipPath>
    <mask id="ice-mask-archive-division-bell">
      <rect x="0" y="0" width="420" height="460" fill="white"/>
      
    </mask>
    <pattern id="pat-archive-division-bell-0" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e2a44c" fill-opacity="0.11"/><path d="M1.5 6L4 2L6.5 6" fill="none" stroke="#e2a44c" stroke-width="1.05" stroke-opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/></pattern>
<pattern id="pat-archive-division-bell-1" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#d16647" fill-opacity="0.12"/><path d="M4 1.8V6.2M1.8 4H6.2" stroke="#d16647" stroke-width="1.05" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-division-bell-2" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e8c86b" fill-opacity="0.10"/><line x1="1.5" y1="5.5" x2="5.5" y2="1.5" stroke="#e8c86b" stroke-width="1.1" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-division-bell-3" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e5b968" fill-opacity="0.09"/><circle cx="2" cy="2" r="1.15" fill="#e5b968" fill-opacity="0.85"/><circle cx="5.5" cy="5.5" r="1.15" fill="#e5b968" fill-opacity="0.85"/></pattern>
  </defs>

  <!-- Subterranean Speakeasy Blueprint Canvas -->
  <rect width="420" height="460" fill="url(#bg-glow-archive-division-bell)"/>
  <rect x="14" y="14" width="392" height="432" rx="8" fill="none" stroke="#e8c59e" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Proportional Patterned Liquid Layers (Clipped to Glass & Masked Around Ice) -->
  <g clip-path="url(#glass-clip-archive-division-bell)">
    <g mask="url(#ice-mask-archive-division-bell)">
      <rect x="40" y="242.60" width="240" height="23.40" fill="url(#pat-archive-division-bell-0)"/><line x1="40" y1="242.60" x2="280" y2="242.60" stroke="#e2a44c" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="225.05" width="240" height="17.55" fill="url(#pat-archive-division-bell-1)"/><line x1="40" y1="225.05" x2="280" y2="225.05" stroke="#d16647" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="207.50" width="240" height="17.55" fill="url(#pat-archive-division-bell-2)"/><line x1="40" y1="207.50" x2="280" y2="207.50" stroke="#e8c86b" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="195.80" width="240" height="11.70" fill="url(#pat-archive-division-bell-3)"/><line x1="40" y1="195.80" x2="280" y2="195.80" stroke="#e5b968" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    
  </g>

  <!-- Minimalist Open-Top Glass Silhouette -->
  <path d="M 77.0 176.0 C 77.0 229.0, 109.0 267.0, 152.0 267.0 C 195.0 267.0, 227.0 229.0, 227.0 176.0" fill="none" stroke="#d8c7b4" stroke-width="2" stroke-linecap="round"/><line x1="152.0" y1="267.0" x2="152.0" y2="350" stroke="#d8c7b4" stroke-width="2"/><path d="M 108.0 350 L 196.0 350" stroke="#d8c7b4" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Garnish, Bitters Droplets & Botanical Accents -->
  <g fill="none" stroke="#df7362" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="M 110.0 166.0 C 110.0 188.0, 144.0 190.0, 146.0 166.0 C 148.0 148.0, 126.0 148.0, 128.0 168.0 C 130.0 190.0, 174.0 190.0, 176.0 168.0 C 178.0 150.0, 158.0 150.0, 160.0 170.0 C 162.0 188.0, 192.0 186.0, 198.0 168.0"/><path d="M 114.0 166.0 C 114.0 184.0, 140.0 186.0, 142.0 166.0" stroke-opacity="0.55" stroke-width="1.0"/></g>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="218.6,201.6 234.0,201.6 240.0,201.6" fill="none" stroke="#e5b968" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="218.6" cy="201.6" r="1.5" fill="#e5b968"/><text x="245.0" y="204.6" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.5" fill="#e5b968" font-weight="600">0.5 oz</tspan> <tspan fill="#c7b9ab">Maraschino</tspan></text></g><g class="spec-svg-callout"><polyline points="211.0,216.3 234.0,217.1 240.0,217.1" fill="none" stroke="#e8c86b" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="211.0" cy="216.3" r="1.5" fill="#e8c86b"/><text x="245.0" y="220.1" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.75" fill="#e8c86b" font-weight="600">0.75 oz</tspan> <tspan fill="#c7b9ab">Fresh lime juice</tspan></text></g><g class="spec-svg-callout"><polyline points="200.2,233.8 234.0,233.8 240.0,233.8" fill="none" stroke="#d16647" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="200.2" cy="233.8" r="1.5" fill="#d16647"/><text x="245.0" y="236.8" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.75" fill="#d16647" font-weight="600">0.75 oz</tspan> <tspan fill="#c7b9ab">Aperol</tspan></text></g><g class="spec-svg-callout"><polyline points="182.7,254.3 234.0,254.3 240.0,254.3" fill="none" stroke="#e2a44c" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="182.7" cy="254.3" r="1.5" fill="#e2a44c"/><text x="245.0" y="257.3" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1" fill="#e2a44c" font-weight="600">1 oz</tspan> <tspan fill="#c7b9ab">Artisanal mezcal</tspan></text></g>
</svg>