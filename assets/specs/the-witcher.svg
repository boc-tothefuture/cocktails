<path d="M 201.4 169.3 C 204.9 173.8, 204.9 177.8, 201.4 177.8 C 197.9 177.8, 197.9 173.8, 201.4 169.3 Z" fill="none" stroke="#d65a4a" stroke-width="1.35"/>
<path d="M 201.4 156.8 C 204.9 161.3, 204.9 165.3, 201.4 165.3 C 197.9 165.3, 197.9 161.3, 201.4 156.8 Z" fill="none" stroke="#d65a4a" stroke-width="1.35"/>
<g stroke="#c95959" stroke-width="1.4" fill="none"><line x1="154.0" y1="207.8" x2="186.0" y2="169.8" stroke="#d8c7b4" stroke-width="1.2"/><circle cx="186.0" cy="169.8" r="2" fill="#d8c7b4" stroke="none"/><circle cx="168.0" cy="191.8" r="6.5" fill="#180d0d" stroke="#c95959" stroke-width="1.5"/></g>
<g fill="none" stroke="#c7b9ab" stroke-width="1.1" stroke-opacity="0.45" stroke-linecap="round" stroke-dasharray="3 3"><path d="M 126.0 170.0 C 116.0 154.0, 140.0 146.0, 130.0 130.0"/><path d="M 160.0 166.0 C 150.0 150.0, 174.0 142.0, 164.0 126.0"/></g>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="219.8,199.1 234.0,199.1 240.0,199.1" fill="none" stroke="#82b078" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="219.8" cy="199.1" r="1.5" fill="#82b078"/><text x="245.0" y="202.1" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-count="1" data-unit="splash" fill="#82b078" font-weight="600">1 splash</tspan> <tspan fill="#c7b9ab">Absinthe</tspan></text></g><g class="spec-svg-callout"><polyline points="213.5,211.6 234.0,214.6 240.0,214.6" fill="none" stroke="#d16647" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="213.5" cy="211.6" r="1.5" fill="#d16647"/><text x="245.0" y="217.6" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1" fill="#d16647" font-weight="600">1 oz</tspan> <tspan fill="#c7b9ab">Aperol</tspan></text></g><g class="spec-svg-callout"><polyline points="203.0,229.7 234.0,230.1 240.0,230.1" fill="none" stroke="#e5b968" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="203.0" cy="229.7" r="1.5" fill="#e5b968"/><text x="245.0" y="233.1" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1" fill="#e5b968" font-weight="600">1 oz</tspan> <tspan fill="#c7b9ab">Cointreau</tspan></text></g><g class="spec-svg-callout"><polyline points="184.8,252.4 234.0,252.4 240.0,252.4" fill="none" stroke="#e08c38" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="184.8" cy="252.4" r="1.5" fill="#e08c38"/><text x="245.0" y="255.4" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1.5" fill="#e08c38" font-weight="600">1.5 oz</tspan> <tspan fill="#c7b9ab">Bourbon whiskey</tspan></text></g>
</svg>