<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="100%" height="100%" class="cocktail-spec-svg" role="img" aria-label="Azalea proportional build diagram">
  <defs>
    <radialGradient id="bg-glow-archive-azalea" cx="38%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#1d1511"/>
      <stop offset="65%" stop-color="#110c0a"/>
      <stop offset="100%" stop-color="#090605"/>
    </radialGradient>
    <clipPath id="glass-clip-archive-azalea">
      <path d="M 98.0 146.0 L 108.0 346.0 L 196.0 346.0 L 206.0 146.0 Z"/>
    </clipPath>
    <mask id="ice-mask-archive-azalea">
      <rect x="0" y="0" width="420" height="460" fill="white"/>
      <rect x="112.0" y="189.0" width="42.0" height="42.0" rx="1.5" transform="rotate(-5 133.0 210.0)" fill="black"/><rect x="122.0" y="235.0" width="38.0" height="38.0" rx="1.5" transform="rotate(7 141.0 254.0)" fill="black"/>
    </mask>
    <pattern id="pat-archive-azalea-0" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#d4ccc2" fill-opacity="0.09"/><circle cx="2" cy="2" r="1.15" fill="#d4ccc2" fill-opacity="0.85"/><circle cx="5.5" cy="5.5" r="1.15" fill="#d4ccc2" fill-opacity="0.85"/></pattern>
<pattern id="pat-archive-azalea-1" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e8c86b" fill-opacity="0.10"/><line x1="1.5" y1="5.5" x2="5.5" y2="1.5" stroke="#e8c86b" stroke-width="1.1" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-azalea-2" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e8c86b" fill-opacity="0.11"/><line x1="2" y1="1.5" x2="2" y2="6.5" stroke="#e8c86b" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="5.5" y1="1.5" x2="5.5" y2="6.5" stroke="#e8c86b" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="2" y1="4" x2="5.5" y2="4" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.55"/></pattern>
<pattern id="pat-archive-azalea-3" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#cc6668" fill-opacity="0.12"/><path d="M4 1.8V6.2M1.8 4H6.2" stroke="#cc6668" stroke-width="1.05" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
  </defs>

  <!-- Speakeasy Blueprint Canvas -->
  <rect width="420" height="460" fill="url(#bg-glow-archive-azalea)"/>
  <rect x="14" y="14" width="392" height="432" rx="8" fill="none" stroke="#e8c59e" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Proportional Patterned Liquid Layers (Clipped to Glass & Masked Around Ice) -->
  <g clip-path="url(#glass-clip-archive-azalea)">
    <g mask="url(#ice-mask-archive-azalea)">
      <rect x="40" y="284.75" width="240" height="61.25" fill="url(#pat-archive-azalea-0)"/><line x1="40" y1="284.75" x2="280" y2="284.75" stroke="#d4ccc2" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="223.49" width="240" height="61.25" fill="url(#pat-archive-azalea-1)"/><line x1="40" y1="223.49" x2="280" y2="223.49" stroke="#e8c86b" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="192.87" width="240" height="30.63" fill="url(#pat-archive-azalea-2)"/><line x1="40" y1="192.87" x2="280" y2="192.87" stroke="#e8c86b" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="186.00" width="240" height="6.87" fill="url(#pat-archive-azalea-3)"/><line x1="40" y1="186.00" x2="280" y2="186.00" stroke="#cc6668" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    <rect x="112.0" y="189.0" width="42.0" height="42.0" rx="1.5" transform="rotate(-5 133.0 210.0)" fill="#110c0a" fill-opacity="0.25" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.22"/><rect x="122.0" y="235.0" width="38.0" height="38.0" rx="1.5" transform="rotate(7 141.0 254.0)" fill="#110c0a" fill-opacity="0.25" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.22"/>
  </g>

  <!-- Minimalist Open-Top Glass Silhouette -->
  <path d="M 97.0 146.0 L 107.0 348.0 Q 107.0 352.0 112.0 352.0 L 192.0 352.0 Q 197.0 352.0 197.0 348.0 L 207.0 146.0" fill="none" stroke="#d8c7b4" stroke-width="2" stroke-linecap="round"/>

  <!-- Garnish, Bitters Droplets & Botanical Accents -->
  <g><circle cx="160.0" cy="184.0" r="16" fill="#120d0b" stroke="#e8c86b" stroke-width="1.5"/><circle cx="160.0" cy="184.0" r="13" fill="none" stroke="#e8c86b" stroke-width="0.8" stroke-opacity="0.6"/><line x1="160.0" y1="184.0" x2="175.0" y2="184.0" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="184.0" x2="170.6" y2="194.6" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="184.0" x2="160.0" y2="199.0" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="184.0" x2="149.4" y2="194.6" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="184.0" x2="145.0" y2="184.0" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="184.0" x2="149.4" y2="173.4" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="184.0" x2="160.0" y2="169.0" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="184.0" x2="170.6" y2="173.4" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.7"/></g>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="207.8,189.4 234.0,189.4 240.0,189.4" fill="none" stroke="#cc6668" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="207.8" cy="189.4" r="1.5" fill="#cc6668"/><text x="245.0" y="192.4" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.125" data-barspoon="true" data-short="true" fill="#cc6668" font-weight="600">1 bsp</tspan> <tspan fill="#c7b9ab">Grenadine</tspan></text></g><g class="spec-svg-callout"><polyline points="206.9,208.2 234.0,208.2 240.0,208.2" fill="none" stroke="#e8c86b" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="206.9" cy="208.2" r="1.5" fill="#e8c86b"/><text x="245.0" y="211.2" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1" fill="#e8c86b" font-weight="600">1 oz</tspan> <tspan fill="#c7b9ab">Fresh lemon juice</tspan></text></g><g class="spec-svg-callout"><polyline points="204.6,254.1 234.0,254.1 240.0,254.1" fill="none" stroke="#e8c86b" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="204.6" cy="254.1" r="1.5" fill="#e8c86b"/><text x="245.0" y="257.1" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="2" fill="#e8c86b" font-weight="600">2 oz</tspan> <tspan fill="#c7b9ab">Pineapple juice</tspan></text></g><g class="spec-svg-callout"><polyline points="201.5,315.4 234.0,315.4 240.0,315.4" fill="none" stroke="#d4ccc2" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="201.5" cy="315.4" r="1.5" fill="#d4ccc2"/><text x="245.0" y="318.4" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="2" fill="#d4ccc2" font-weight="600">2 oz</tspan> <tspan fill="#c7b9ab">Gin</tspan></text></g>
</svg>