      <stop offset="65%" stop-color="#110c0a"/>
      <stop offset="100%" stop-color="#090605"/>
    </radialGradient>
    <clipPath id="glass-clip-archive-mint-julep">
      <path d="M 78.0 184.0 L 99.0 346.0 L 205.0 346.0 L 226.0 184.0 Z"/>
    </clipPath>
    <mask id="ice-mask-archive-mint-julep">
      <rect x="0" y="0" width="420" height="460" fill="white"/>
      <rect x="118.0" y="220.4" width="15" height="15" rx="2" transform="rotate(18 125.5 227.9)" fill="black"/><rect x="137.0" y="225.4" width="14" height="14" rx="2" transform="rotate(18 144.0 232.4)" fill="black"/><rect x="157.0" y="220.4" width="15" height="15" rx="2" transform="rotate(18 164.5 227.9)" fill="black"/><rect x="127.0" y="238.4" width="13" height="13" rx="2" transform="rotate(18 133.5 244.9)" fill="black"/><rect x="147.0" y="240.4" width="14" height="14" rx="2" transform="rotate(18 154.0 247.4)" fill="black"/>
    </mask>
    <pattern id="pat-archive-mint-julep-0" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e08c38" fill-opacity="0.11"/><line x1="2" y1="1.5" x2="2" y2="6.5" stroke="#e08c38" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="5.5" y1="1.5" x2="5.5" y2="6.5" stroke="#e08c38" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="2" y1="4" x2="5.5" y2="4" stroke="#e08c38" stroke-width="0.9" stroke-opacity="0.55"/></pattern>
<pattern id="pat-archive-mint-julep-1" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#d68a3e" fill-opacity="0.12"/><line x1="1.5" y1="2" x2="5.5" y2="2" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.85" stroke-linecap="round"/><line x1="5.5" y1="5" x2="9" y2="5" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.85" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-mint-julep-2" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#d68a3e" fill-opacity="0.11"/><line x1="2" y1="1.5" x2="2" y2="6.5" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="5.5" y1="1.5" x2="5.5" y2="6.5" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="2" y1="4" x2="5.5" y2="4" stroke="#d68a3e" stroke-width="0.9" stroke-opacity="0.55"/></pattern>
  </defs>

  <!-- Subterranean Speakeasy Blueprint Canvas -->
  <rect width="420" height="460" fill="url(#bg-glow-archive-mint-julep)"/>
  <rect x="14" y="14" width="392" height="432" rx="8" fill="none" stroke="#e8c59e" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Proportional Patterned Liquid Layers (Clipped to Glass & Masked Around Ice) -->
  <g clip-path="url(#glass-clip-archive-mint-julep)">
    <g mask="url(#ice-mask-archive-mint-julep)">
      <rect x="40" y="243.68" width="240" height="102.32" fill="url(#pat-archive-mint-julep-0)"/><line x1="40" y1="243.68" x2="280" y2="243.68" stroke="#e08c38" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="223.22" width="240" height="20.46" fill="url(#pat-archive-mint-julep-1)"/><line x1="40" y1="223.22" x2="280" y2="223.22" stroke="#d68a3e" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="216.40" width="240" height="6.82" fill="url(#pat-archive-mint-julep-2)"/><line x1="40" y1="216.40" x2="280" y2="216.40" stroke="#d68a3e" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    <rect x="118.0" y="220.4" width="15" height="15" rx="2" transform="rotate(18 125.5 227.9)" fill="none" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.26"/><rect x="137.0" y="225.4" width="14" height="14" rx="2" transform="rotate(18 144.0 232.4)" fill="none" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.26"/><rect x="157.0" y="220.4" width="15" height="15" rx="2" transform="rotate(18 164.5 227.9)" fill="none" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.26"/><rect x="127.0" y="238.4" width="13" height="13" rx="2" transform="rotate(18 133.5 244.9)" fill="none" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.26"/><rect x="147.0" y="240.4" width="14" height="14" rx="2" transform="rotate(18 154.0 247.4)" fill="none" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.26"/>
  </g>

  <!-- Minimalist Open-Top Glass Silhouette -->
  <path d="M 77.0 184.0 L 98.0 347.0 Q 98.0 351.0 103.0 351.0 L 201.0 351.0 Q 206.0 351.0 206.0 347.0 L 227.0 184.0" fill="none" stroke="#d8c7b4" stroke-width="2" stroke-linecap="round"/><line x1="76.0" y1="187.0" x2="228.0" y2="187.0" stroke="#d8c7b4" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- Garnish, Bitters Droplets & Botanical Accents -->
  <g fill="none" stroke="#86b478" stroke-width="1.35" stroke-linecap="round"><path d="M 132.0 232.4 Q 124.0 207.4 116.0 184.4"/><path d="M 128.0 218.4 C 118.0 214.4, 118.0 208.4, 127.0 210.4"/><path d="M 128.0 218.4 C 136.0 212.4, 136.0 206.4, 127.0 210.4"/><path d="M 123.0 204.4 C 113.0 200.4, 113.0 194.4, 122.0 197.4"/><path d="M 123.0 204.4 C 131.0 198.4, 131.0 192.4, 122.0 197.4"/><path d="M 119.0 192.4 C 110.0 188.4, 112.0 182.4, 118.0 186.4"/></g>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="225.4,219.8 234.0,219.8 240.0,219.8" fill="none" stroke="#d68a3e" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="225.4" cy="219.8" r="1.5" fill="#d68a3e"/><text x="245.0" y="222.8" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-count="0.5" data-unit="tsp" fill="#d68a3e" font-weight="600">0.5 tsp</tspan> <tspan fill="#c7b9ab">Granulated sugar</tspan></text></g><g class="spec-svg-callout"><polyline points="223.6,233.4 234.0,235.3 240.0,235.3" fill="none" stroke="#d68a3e" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="223.6" cy="233.4" r="1.5" fill="#d68a3e"/><text x="245.0" y="238.3" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.5" fill="#d68a3e" font-weight="600">0.5 oz</tspan> <tspan fill="#c7b9ab">Simple syrup</tspan></text></g><g class="spec-svg-callout"><polyline points="215.6,294.8 234.0,294.8 240.0,294.8" fill="none" stroke="#e08c38" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="215.6" cy="294.8" r="1.5" fill="#e08c38"/><text x="245.0" y="297.8" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="2.5" fill="#e08c38" font-weight="600">2.5 oz</tspan> <tspan fill="#c7b9ab">Woodford Bourbon</tspan></text></g>
</svg>