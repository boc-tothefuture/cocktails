  <path d="M 205.0 205.0 C 208.5 209.5, 208.5 213.5, 205.0 213.5 C 201.5 213.5, 201.5 209.5, 205.0 205.0 Z" fill="none" stroke="#d65a4a" stroke-width="1.35"/>
<path d="M 205.0 192.5 C 208.5 197.0, 208.5 201.0, 205.0 201.0 C 201.5 201.0, 201.5 197.0, 205.0 192.5 Z" fill="none" stroke="#d65a4a" stroke-width="1.35"/>
<g fill="none" stroke="#86b478" stroke-width="1.35" stroke-linecap="round"><path d="M 132.0 238.9 Q 124.0 213.9 116.0 190.9"/><path d="M 128.0 224.9 C 118.0 220.9, 118.0 214.9, 127.0 216.9"/><path d="M 128.0 224.9 C 136.0 218.9, 136.0 212.9, 127.0 216.9"/><path d="M 123.0 210.9 C 113.0 206.9, 113.0 200.9, 122.0 203.9"/><path d="M 123.0 210.9 C 131.0 204.9, 131.0 198.9, 122.0 203.9"/><path d="M 119.0 198.9 C 110.0 194.9, 112.0 188.9, 118.0 192.9"/></g>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="224.1,229.7 234.0,229.7 240.0,229.7" fill="none" stroke="#d68a3e" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="224.1" cy="229.7" r="1.5" fill="#d68a3e"/><text x="245.0" y="232.7" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.25" fill="#d68a3e" font-weight="600">0.25 oz</tspan> <tspan fill="#c7b9ab">Cinnamon syrup</tspan></text></g><g class="spec-svg-callout"><polyline points="221.4,250.2 234.0,250.2 240.0,250.2" fill="none" stroke="#e5b968" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="221.4" cy="250.2" r="1.5" fill="#e5b968"/><text x="245.0" y="253.2" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.5" fill="#e5b968" font-weight="600">0.5 oz</tspan> <tspan fill="#c7b9ab">Bénédictine D.O.M.</tspan></text></g><g class="spec-svg-callout"><polyline points="214.3,305.0 234.0,305.0 240.0,305.0" fill="none" stroke="#e08c38" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="214.3" cy="305.0" r="1.5" fill="#e08c38"/><text x="245.0" y="308.0" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1.5" fill="#e08c38" font-weight="600">1.5 oz</tspan> <tspan fill="#c7b9ab">Peated Scotch</tspan></text></g>
</svg>