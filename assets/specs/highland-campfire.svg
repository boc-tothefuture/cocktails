  <rect x="14" y="14" width="392" height="432" rx="8" fill="none" stroke="#e8c59e" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Proportional Patterned Liquid Layers (Clipped to Glass & Masked Around Ice) -->
  <g clip-path="url(#glass-clip-archive-highland-campfire)">
    <g mask="url(#ice-mask-archive-highland-campfire)">
      <rect x="40" y="263.92" width="240" height="82.08" fill="url(#pat-archive-highland-campfire-0)"/><line x1="40" y1="263.92" x2="280" y2="263.92" stroke="#e08c38" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="236.56" width="240" height="27.36" fill="url(#pat-archive-highland-campfire-1)"/><line x1="40" y1="236.56" x2="280" y2="236.56" stroke="#e5b968" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="222.88" width="240" height="13.68" fill="url(#pat-archive-highland-campfire-2)"/><line x1="40" y1="222.88" x2="280" y2="222.88" stroke="#d68a3e" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    <rect x="96.3" y="223.9" width="66.0" height="68.0" rx="1.5" fill="#110c0a" fill-opacity="0.25" stroke="#dfd2c0" stroke-width="0.9" stroke-opacity="0.22"/>
  </g>

