<pattern id="pat-archive-a-certain-aesthetic-2" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#cc6668" fill-opacity="0.11"/><line x1="2" y1="1.5" x2="2" y2="6.5" stroke="#cc6668" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="5.5" y1="1.5" x2="5.5" y2="6.5" stroke="#cc6668" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="2" y1="4" x2="5.5" y2="4" stroke="#cc6668" stroke-width="0.9" stroke-opacity="0.55"/></pattern>
