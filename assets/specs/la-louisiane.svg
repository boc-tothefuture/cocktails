<path d="M 201.4 144.3 C 204.9 148.8, 204.9 152.8, 201.4 152.8 C 197.9 152.8, 197.9 148.8, 201.4 144.3 Z" fill="none" stroke="#d65a4a" stroke-width="1.35"/>
<path d="M 201.4 131.8 C 204.9 136.3, 204.9 140.3, 201.4 140.3 C 197.9 140.3, 197.9 136.3, 201.4 131.8 Z" fill="none" stroke="#d65a4a" stroke-width="1.35"/>
<path d="M 201.4 119.3 C 204.9 123.8, 204.9 127.8, 201.4 127.8 C 197.9 127.8, 197.9 123.8, 201.4 119.3 Z" fill="none" stroke="#d65a4a" stroke-width="1.35"/>
<g stroke="#c95959" stroke-width="1.4" fill="none"><line x1="154.0" y1="207.8" x2="186.0" y2="169.8" stroke="#d8c7b4" stroke-width="1.2"/><circle cx="186.0" cy="169.8" r="2" fill="#d8c7b4" stroke="none"/><circle cx="168.0" cy="191.8" r="6.5" fill="#180d0d" stroke="#c95959" stroke-width="1.5"/></g>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="218.8,201.2 234.0,201.2 240.0,201.2" fill="none" stroke="#e5b968" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="218.8" cy="201.2" r="1.5" fill="#e5b968"/><text x="245.0" y="204.2" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.5" fill="#e5b968" font-weight="600">0.5 oz</tspan> <tspan fill="#c7b9ab">Bénédictine D.O.M.</tspan></text></g><g class="spec-svg-callout"><polyline points="211.9,214.7 234.0,216.7 240.0,216.7" fill="none" stroke="#d16647" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="211.9" cy="214.7" r="1.5" fill="#d16647"/><text x="245.0" y="219.7" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.75" fill="#d16647" font-weight="600">0.75 oz</tspan> <tspan fill="#c7b9ab">Sweet vermouth</tspan></text></g><g class="spec-svg-callout"><polyline points="192.3,244.4 234.0,244.4 240.0,244.4" fill="none" stroke="#e08c38" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="192.3" cy="244.4" r="1.5" fill="#e08c38"/><text x="245.0" y="247.4" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="2" fill="#e08c38" font-weight="600">2 oz</tspan> <tspan fill="#c7b9ab">Straight rye whiskey</tspan></text></g>
</svg>