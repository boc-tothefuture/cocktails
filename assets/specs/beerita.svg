<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="100%" height="100%" class="cocktail-spec-svg" role="img" aria-label="Beerita proportional build diagram">
  <defs>
    <radialGradient id="bg-glow-archive-beerita" cx="38%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#1d1511"/>
      <stop offset="65%" stop-color="#110c0a"/>
      <stop offset="100%" stop-color="#090605"/>
    </radialGradient>
    <clipPath id="glass-clip-archive-beerita">
      <path d="M 78.0 184.0 L 99.0 346.0 L 205.0 346.0 L 226.0 184.0 Z"/>
    </clipPath>
    <mask id="ice-mask-archive-beerita">
      <rect x="0" y="0" width="420" height="460" fill="white"/>
      <rect x="118.0" y="220.4" width="15" height="15" rx="2" transform="rotate(18 125.5 227.9)" fill="black"/><rect x="137.0" y="225.4" width="14" height="14" rx="2" transform="rotate(18 144.0 232.4)" fill="black"/><rect x="157.0" y="220.4" width="15" height="15" rx="2" transform="rotate(18 164.5 227.9)" fill="black"/><rect x="127.0" y="238.4" width="13" height="13" rx="2" transform="rotate(18 133.5 244.9)" fill="black"/><rect x="147.0" y="240.4" width="14" height="14" rx="2" transform="rotate(18 154.0 247.4)" fill="black"/>
    </mask>
    <pattern id="pat-archive-beerita-0" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e2a44c" fill-opacity="0.11"/><path d="M1.5 6L4 2L6.5 6" fill="none" stroke="#e2a44c" stroke-width="1.05" stroke-opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/></pattern>
<pattern id="pat-archive-beerita-1" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e8c86b" fill-opacity="0.10"/><line x1="1.5" y1="5.5" x2="5.5" y2="1.5" stroke="#e8c86b" stroke-width="1.1" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-beerita-2" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#dfd2c0" fill-opacity="0.07"/><circle cx="3.5" cy="8.5" r="1.7" fill="none" stroke="#dfd2c0" stroke-width="0.95" stroke-opacity="0.78"/><circle cx="9" cy="4" r="1.2" fill="none" stroke="#dfd2c0" stroke-width="0.9" stroke-opacity="0.7"/><circle cx="6.5" cy="10.5" r="0.7" fill="#dfd2c0" fill-opacity="0.65"/></pattern>
  </defs>

  <!-- Subterranean Speakeasy Blueprint Canvas -->
  <rect width="420" height="460" fill="url(#bg-glow-archive-beerita)"/>
  <rect x="14" y="14" width="392" height="432" rx="8" fill="none" stroke="#e8c59e" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Proportional Patterned Liquid Layers (Clipped to Glass & Masked Around Ice) -->
  <g clip-path="url(#glass-clip-archive-beerita)">
    <g mask="url(#ice-mask-archive-beerita)">
      <rect x="40" y="318.23" width="240" height="27.77" fill="url(#pat-archive-beerita-0)"/><line x1="40" y1="318.23" x2="280" y2="318.23" stroke="#e2a44c" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="290.46" width="240" height="27.77" fill="url(#pat-archive-beerita-1)"/><line x1="40" y1="290.46" x2="280" y2="290.46" stroke="#e8c86b" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="216.40" width="240" height="74.06" fill="url(#pat-archive-beerita-2)"/><line x1="40" y1="216.40" x2="280" y2="216.40" stroke="#dfd2c0" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    <rect x="118.0" y="220.4" width="15" height="15" rx="2" transform="rotate(18 125.5 227.9)" fill="none" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.26"/><rect x="137.0" y="225.4" width="14" height="14" rx="2" transform="rotate(18 144.0 232.4)" fill="none" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.26"/><rect x="157.0" y="220.4" width="15" height="15" rx="2" transform="rotate(18 164.5 227.9)" fill="none" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.26"/><rect x="127.0" y="238.4" width="13" height="13" rx="2" transform="rotate(18 133.5 244.9)" fill="none" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.26"/><rect x="147.0" y="240.4" width="14" height="14" rx="2" transform="rotate(18 154.0 247.4)" fill="none" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.26"/>
  </g>

  <!-- Minimalist Open-Top Glass Silhouette -->
  <path d="M 77.0 184.0 L 98.0 347.0 Q 98.0 351.0 103.0 351.0 L 201.0 351.0 Q 206.0 351.0 206.0 347.0 L 227.0 184.0" fill="none" stroke="#d8c7b4" stroke-width="2" stroke-linecap="round"/>

  <!-- Garnish, Bitters Droplets & Botanical Accents -->
  <g><circle cx="160.0" cy="214.4" r="16" fill="#120d0b" stroke="#a8c66c" stroke-width="1.5"/><circle cx="160.0" cy="214.4" r="13" fill="none" stroke="#a8c66c" stroke-width="0.8" stroke-opacity="0.6"/><line x1="160.0" y1="214.4" x2="175.0" y2="214.4" stroke="#a8c66c" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="170.6" y2="225.0" stroke="#a8c66c" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="160.0" y2="229.4" stroke="#a8c66c" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="149.4" y2="225.0" stroke="#a8c66c" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="145.0" y2="214.4" stroke="#a8c66c" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="149.4" y2="203.8" stroke="#a8c66c" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="160.0" y2="199.4" stroke="#a8c66c" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="170.6" y2="203.8" stroke="#a8c66c" stroke-width="0.9" stroke-opacity="0.7"/></g>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="221.0,253.4 234.0,253.4 240.0,253.4" fill="none" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="221.0" cy="253.4" r="1.5" fill="#dfd2c0"/><text x="245.0" y="256.4" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="4" fill="#dfd2c0" font-weight="600">4 oz</tspan> <tspan fill="#c7b9ab">Crisp Lager</tspan></text></g><g class="spec-svg-callout"><polyline points="214.4,304.3 234.0,304.3 240.0,304.3" fill="none" stroke="#e8c86b" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="214.4" cy="304.3" r="1.5" fill="#e8c86b"/><text x="245.0" y="307.3" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1.5" fill="#e8c86b" font-weight="600">1.5 oz</tspan> <tspan fill="#c7b9ab">Limeade Conc.</tspan></text></g><g class="spec-svg-callout"><polyline points="210.8,332.1 234.0,332.1 240.0,332.1" fill="none" stroke="#e2a44c" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="210.8" cy="332.1" r="1.5" fill="#e2a44c"/><text x="245.0" y="335.1" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1.5" fill="#e2a44c" font-weight="600">1.5 oz</tspan> <tspan fill="#c7b9ab">Reposado tequila</tspan></text></g>
</svg>