<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="100%" height="100%" class="cocktail-spec-svg" role="img" aria-label="Baileys Espresso Martini proportional build diagram">
  <defs>
    <radialGradient id="bg-glow-archive-baileys-espresso-martini" cx="38%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#1d1511"/>
      <stop offset="65%" stop-color="#110c0a"/>
      <stop offset="100%" stop-color="#090605"/>
    </radialGradient>
    <clipPath id="glass-clip-archive-baileys-espresso-martini">
      <path d="M 74.0 174.0 L 152.0 272.0 L 230.0 174.0 Z"/>
    </clipPath>
    <mask id="ice-mask-archive-baileys-espresso-martini">
      <rect x="0" y="0" width="420" height="460" fill="white"/>
      
    </mask>
    <pattern id="pat-archive-baileys-espresso-martini-0" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#f2e6d8" fill-opacity="0.18"/><circle cx="1.5" cy="1.5" r="0.9" fill="#f2e6d8" fill-opacity="0.9"/><circle cx="4" cy="3.8" r="0.75" fill="#f2e6d8" fill-opacity="0.75"/></pattern>
<pattern id="pat-archive-baileys-espresso-martini-1" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#9e6b47" fill-opacity="0.11"/><line x1="2" y1="1.5" x2="2" y2="6.5" stroke="#9e6b47" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="5.5" y1="1.5" x2="5.5" y2="6.5" stroke="#9e6b47" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="2" y1="4" x2="5.5" y2="4" stroke="#9e6b47" stroke-width="0.9" stroke-opacity="0.55"/></pattern>
<pattern id="pat-archive-baileys-espresso-martini-2" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#d4ccc2" fill-opacity="0.09"/><circle cx="2" cy="2" r="1.15" fill="#d4ccc2" fill-opacity="0.85"/><circle cx="5.5" cy="5.5" r="1.15" fill="#d4ccc2" fill-opacity="0.85"/></pattern>
  </defs>

  <!-- Subterranean Speakeasy Blueprint Canvas -->
  <rect width="420" height="460" fill="url(#bg-glow-archive-baileys-espresso-martini)"/>
  <rect x="14" y="14" width="392" height="432" rx="8" fill="none" stroke="#e8c59e" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Proportional Patterned Liquid Layers (Clipped to Glass & Masked Around Ice) -->
  <g clip-path="url(#glass-clip-archive-baileys-espresso-martini)">
    <g mask="url(#ice-mask-archive-baileys-espresso-martini)">
      <rect x="40" y="233.78" width="240" height="38.22" fill="url(#pat-archive-baileys-espresso-martini-0)"/><line x1="40" y1="233.78" x2="280" y2="233.78" stroke="#f2e6d8" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="214.67" width="240" height="19.11" fill="url(#pat-archive-baileys-espresso-martini-1)"/><line x1="40" y1="214.67" x2="280" y2="214.67" stroke="#9e6b47" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="195.56" width="240" height="19.11" fill="url(#pat-archive-baileys-espresso-martini-2)"/><line x1="40" y1="195.56" x2="280" y2="195.56" stroke="#d4ccc2" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    
  </g>

  <!-- Minimalist Open-Top Glass Silhouette -->
  <path d="M 73.0 174.0 L 152.0 273.0 L 231.0 174.0" fill="none" stroke="#d8c7b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="152.0" y1="273.0" x2="152.0" y2="350" stroke="#d8c7b4" stroke-width="2"/><path d="M 108.0 350 L 196.0 350" stroke="#d8c7b4" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Garnish, Bitters Droplets & Botanical Accents -->
  <g transform="translate(140.0, 193.6) rotate(-15)"><ellipse cx="0" cy="0" rx="5" ry="3.2" fill="#14100e" stroke="#c88d55" stroke-width="1.2"/><path d="M -3.5 0 Q 0 1.2 3.5 0" fill="none" stroke="#c88d55" stroke-width="0.9"/></g>
<g transform="translate(152.0, 191.6) rotate(10)"><ellipse cx="0" cy="0" rx="5" ry="3.2" fill="#14100e" stroke="#c88d55" stroke-width="1.2"/><path d="M -3.5 0 Q 0 1.2 3.5 0" fill="none" stroke="#c88d55" stroke-width="0.9"/></g>
<g transform="translate(164.0, 193.6) rotate(-25)"><ellipse cx="0" cy="0" rx="5" ry="3.2" fill="#14100e" stroke="#c88d55" stroke-width="1.2"/><path d="M -3.5 0 Q 0 1.2 3.5 0" fill="none" stroke="#c88d55" stroke-width="0.9"/></g>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="209.2,205.1 234.0,205.1 240.0,205.1" fill="none" stroke="#d4ccc2" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="209.2" cy="205.1" r="1.5" fill="#d4ccc2"/><text x="245.0" y="208.1" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.85" fill="#d4ccc2" font-weight="600">0.85 oz</tspan> <tspan fill="#c7b9ab">Distilled vodka</tspan></text></g><g class="spec-svg-callout"><polyline points="194.0,224.2 234.0,224.2 240.0,224.2" fill="none" stroke="#9e6b47" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="194.0" cy="224.2" r="1.5" fill="#9e6b47"/><text x="245.0" y="227.2" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.85" fill="#9e6b47" font-weight="600">0.85 oz</tspan> <tspan fill="#c7b9ab">Fresh espresso</tspan></text></g><g class="spec-svg-callout"><polyline points="171.2,252.9 234.0,252.9 240.0,252.9" fill="none" stroke="#f2e6d8" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="171.2" cy="252.9" r="1.5" fill="#f2e6d8"/><text x="245.0" y="255.9" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1.7" fill="#f2e6d8" font-weight="600">1.7 oz</tspan> <tspan fill="#c7b9ab">Baileys Irish Cream</tspan></text></g>
</svg>