<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="100%" height="100%" class="cocktail-spec-svg" role="img" aria-label="Irish Maid proportional build diagram">
  <defs>
    <radialGradient id="bg-glow-archive-irish-maid" cx="38%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#1d1511"/>
      <stop offset="65%" stop-color="#110c0a"/>
      <stop offset="100%" stop-color="#090605"/>
    </radialGradient>
    <clipPath id="glass-clip-archive-irish-maid">
      <path d="M 78.0 184.0 L 99.0 346.0 L 205.0 346.0 L 226.0 184.0 Z"/>
    </clipPath>
    <mask id="ice-mask-archive-irish-maid">
      <rect x="0" y="0" width="420" height="460" fill="white"/>
      <rect x="95.8" y="219.4" width="42.0" height="42.0" rx="1.5" transform="rotate(-5 116.8 240.4)" fill="black"/><rect x="105.8" y="265.4" width="38.0" height="38.0" rx="1.5" transform="rotate(7 124.8 284.4)" fill="black"/>
    </mask>
    <pattern id="pat-archive-irish-maid-0" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e08c38" fill-opacity="0.11"/><line x1="2" y1="1.5" x2="2" y2="6.5" stroke="#e08c38" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="5.5" y1="1.5" x2="5.5" y2="6.5" stroke="#e08c38" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="2" y1="4" x2="5.5" y2="4" stroke="#e08c38" stroke-width="0.9" stroke-opacity="0.55"/></pattern>
<pattern id="pat-archive-irish-maid-1" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e5b968" fill-opacity="0.09"/><circle cx="2" cy="2" r="1.15" fill="#e5b968" fill-opacity="0.85"/><circle cx="5.5" cy="5.5" r="1.15" fill="#e5b968" fill-opacity="0.85"/></pattern>
<pattern id="pat-archive-irish-maid-2" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e8c86b" fill-opacity="0.10"/><line x1="1.5" y1="5.5" x2="5.5" y2="1.5" stroke="#e8c86b" stroke-width="1.1" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-irish-maid-3" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#d68a3e" fill-opacity="0.12"/><line x1="1.5" y1="2" x2="5.5" y2="2" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.85" stroke-linecap="round"/><line x1="5.5" y1="5" x2="9" y2="5" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.85" stroke-linecap="round"/></pattern>
  </defs>

  <!-- Subterranean Speakeasy Blueprint Canvas -->
  <rect width="420" height="460" fill="url(#bg-glow-archive-irish-maid)"/>
  <rect x="14" y="14" width="392" height="432" rx="8" fill="none" stroke="#e8c59e" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Proportional Patterned Liquid Layers (Clipped to Glass & Masked Around Ice) -->
  <g clip-path="url(#glass-clip-archive-irish-maid)">
    <g mask="url(#ice-mask-archive-irish-maid)">
      <rect x="40" y="281.20" width="240" height="64.80" fill="url(#pat-archive-irish-maid-0)"/><line x1="40" y1="281.20" x2="280" y2="281.20" stroke="#e08c38" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="265.00" width="240" height="16.20" fill="url(#pat-archive-irish-maid-1)"/><line x1="40" y1="265.00" x2="280" y2="265.00" stroke="#e5b968" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="240.70" width="240" height="24.30" fill="url(#pat-archive-irish-maid-2)"/><line x1="40" y1="240.70" x2="280" y2="240.70" stroke="#e8c86b" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="216.40" width="240" height="24.30" fill="url(#pat-archive-irish-maid-3)"/><line x1="40" y1="216.40" x2="280" y2="216.40" stroke="#d68a3e" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    <rect x="95.8" y="219.4" width="42.0" height="42.0" rx="1.5" transform="rotate(-5 116.8 240.4)" fill="#110c0a" fill-opacity="0.25" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.22"/><rect x="105.8" y="265.4" width="38.0" height="38.0" rx="1.5" transform="rotate(7 124.8 284.4)" fill="#110c0a" fill-opacity="0.25" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.22"/>
  </g>

  <!-- Minimalist Open-Top Glass Silhouette -->
  <path d="M 77.0 184.0 L 98.0 347.0 Q 98.0 351.0 103.0 351.0 L 201.0 351.0 Q 206.0 351.0 206.0 347.0 L 227.0 184.0" fill="none" stroke="#d8c7b4" stroke-width="2" stroke-linecap="round"/>

  <!-- Garnish, Bitters Droplets & Botanical Accents -->
  <g><circle cx="160.0" cy="214.4" r="16" fill="#120d0b" stroke="#a8c66c" stroke-width="1.5"/><circle cx="160.0" cy="214.4" r="13" fill="none" stroke="#a8c66c" stroke-width="0.8" stroke-opacity="0.6"/><line x1="160.0" y1="214.4" x2="175.0" y2="214.4" stroke="#a8c66c" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="170.6" y2="225.0" stroke="#a8c66c" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="160.0" y2="229.4" stroke="#a8c66c" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="149.4" y2="225.0" stroke="#a8c66c" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="145.0" y2="214.4" stroke="#a8c66c" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="149.4" y2="203.8" stroke="#a8c66c" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="160.0" y2="199.4" stroke="#a8c66c" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="170.6" y2="203.8" stroke="#a8c66c" stroke-width="0.9" stroke-opacity="0.7"/></g>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="224.2,228.5 234.0,228.5 240.0,228.5" fill="none" stroke="#d68a3e" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="224.2" cy="228.5" r="1.5" fill="#d68a3e"/><text x="245.0" y="231.5" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.75" fill="#d68a3e" font-weight="600">0.75 oz</tspan> <tspan fill="#c7b9ab">Cane Simple Syrup</tspan></text></g><g class="spec-svg-callout"><polyline points="221.1,252.8 234.0,252.8 240.0,252.8" fill="none" stroke="#e8c86b" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="221.1" cy="252.8" r="1.5" fill="#e8c86b"/><text x="245.0" y="255.8" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.75" fill="#e8c86b" font-weight="600">0.75 oz</tspan> <tspan fill="#c7b9ab">Fresh lemon juice</tspan></text></g><g class="spec-svg-callout"><polyline points="218.4,273.1 234.0,273.1 240.0,273.1" fill="none" stroke="#e5b968" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="218.4" cy="273.1" r="1.5" fill="#e5b968"/><text x="245.0" y="276.1" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.5" fill="#e5b968" font-weight="600">0.5 oz</tspan> <tspan fill="#c7b9ab">St-Germain</tspan></text></g><g class="spec-svg-callout"><polyline points="213.2,313.6 234.0,313.6 240.0,313.6" fill="none" stroke="#e08c38" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="213.2" cy="313.6" r="1.5" fill="#e08c38"/><text x="245.0" y="316.6" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="2" fill="#e08c38" font-weight="600">2 oz</tspan> <tspan fill="#c7b9ab">Irish whiskey</tspan></text></g>
</svg>