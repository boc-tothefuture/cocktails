<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="100%" height="100%" class="cocktail-spec-svg" role="img" aria-label="Frozen Martini proportional build diagram">
  <defs>
    <radialGradient id="bg-glow-archive-frozen-martini" cx="38%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#1d1511"/>
      <stop offset="65%" stop-color="#110c0a"/>
      <stop offset="100%" stop-color="#090605"/>
    </radialGradient>
    <clipPath id="glass-clip-archive-frozen-martini">
      <path d="M 74.0 174.0 L 152.0 272.0 L 230.0 174.0 Z"/>
    </clipPath>
    <mask id="ice-mask-archive-frozen-martini">
      <rect x="0" y="0" width="420" height="460" fill="white"/>
      
    </mask>
    <pattern id="pat-archive-frozen-martini-0" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#d4ccc2" fill-opacity="0.09"/><circle cx="2" cy="2" r="1.15" fill="#d4ccc2" fill-opacity="0.85"/><circle cx="5.5" cy="5.5" r="1.15" fill="#d4ccc2" fill-opacity="0.85"/></pattern>
<pattern id="pat-archive-frozen-martini-1" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e5b968" fill-opacity="0.11"/><line x1="2" y1="1.5" x2="2" y2="6.5" stroke="#e5b968" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="5.5" y1="1.5" x2="5.5" y2="6.5" stroke="#e5b968" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="2" y1="4" x2="5.5" y2="4" stroke="#e5b968" stroke-width="0.9" stroke-opacity="0.55"/></pattern>
<pattern id="pat-archive-frozen-martini-2" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e5b968" fill-opacity="0.09"/><circle cx="2" cy="2" r="1.15" fill="#e5b968" fill-opacity="0.85"/><circle cx="5.5" cy="5.5" r="1.15" fill="#e5b968" fill-opacity="0.85"/></pattern>
<pattern id="pat-archive-frozen-martini-3" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#d4ccc2" fill-opacity="0.11"/><line x1="2" y1="1.5" x2="2" y2="6.5" stroke="#d4ccc2" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="5.5" y1="1.5" x2="5.5" y2="6.5" stroke="#d4ccc2" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="2" y1="4" x2="5.5" y2="4" stroke="#d4ccc2" stroke-width="0.9" stroke-opacity="0.55"/></pattern>
  </defs>

  <!-- Speakeasy Blueprint Canvas -->
  <rect width="420" height="460" fill="url(#bg-glow-archive-frozen-martini)"/>
  <rect x="14" y="14" width="392" height="432" rx="8" fill="none" stroke="#e8c59e" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Proportional Patterned Liquid Layers (Clipped to Glass & Masked Around Ice) -->
  <g clip-path="url(#glass-clip-archive-frozen-martini)">
    <g mask="url(#ice-mask-archive-frozen-martini)">
      <rect x="40" y="233.78" width="240" height="38.22" fill="url(#pat-archive-frozen-martini-0)"/><line x1="40" y1="233.78" x2="280" y2="233.78" stroke="#d4ccc2" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="224.22" width="240" height="9.55" fill="url(#pat-archive-frozen-martini-1)"/><line x1="40" y1="224.22" x2="280" y2="224.22" stroke="#e5b968" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="214.67" width="240" height="9.55" fill="url(#pat-archive-frozen-martini-2)"/><line x1="40" y1="214.67" x2="280" y2="214.67" stroke="#e5b968" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="195.56" width="240" height="19.11" fill="url(#pat-archive-frozen-martini-3)"/><line x1="40" y1="195.56" x2="280" y2="195.56" stroke="#d4ccc2" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    
  </g>

  <!-- Minimalist Open-Top Glass Silhouette -->
  <path d="M 73.0 174.0 L 152.0 273.0 L 231.0 174.0" fill="none" stroke="#d8c7b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="152.0" y1="273.0" x2="152.0" y2="350" stroke="#d8c7b4" stroke-width="2"/><path d="M 108.0 350 L 196.0 350" stroke="#d8c7b4" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Garnish, Bitters Droplets & Botanical Accents -->
  <path d="M 196.8 181.6 C 200.3 186.1, 200.3 190.1, 196.8 190.1 C 193.3 190.1, 193.3 186.1, 196.8 181.6 Z" fill="none" stroke="#eba844" stroke-width="1.35"/>
<g fill="none" stroke="#e8c86b" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="M 110.0 164.0 C 110.0 186.0, 144.0 188.0, 146.0 164.0 C 148.0 146.0, 126.0 146.0, 128.0 166.0 C 130.0 188.0, 174.0 188.0, 176.0 166.0 C 178.0 148.0, 158.0 148.0, 160.0 168.0 C 162.0 186.0, 192.0 184.0, 198.0 166.0"/><path d="M 114.0 164.0 C 114.0 182.0, 140.0 184.0, 142.0 164.0" stroke-opacity="0.55" stroke-width="1.0"/></g>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="209.2,205.1 234.0,205.1 240.0,205.1" fill="none" stroke="#d4ccc2" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="209.2" cy="205.1" r="1.5" fill="#d4ccc2"/><text x="245.0" y="208.1" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1" fill="#d4ccc2" font-weight="600">1 oz</tspan> <tspan fill="#c7b9ab">Filtered water</tspan></text></g><g class="spec-svg-callout"><polyline points="197.8,219.4 234.0,220.6 240.0,220.6" fill="none" stroke="#e5b968" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="197.8" cy="219.4" r="1.5" fill="#e5b968"/><text x="245.0" y="223.6" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.5" fill="#e5b968" font-weight="600">0.5 oz</tspan> <tspan fill="#c7b9ab">Dry vermouth</tspan></text></g><g class="spec-svg-callout"><polyline points="190.2,229.0 234.0,236.1 240.0,236.1" fill="none" stroke="#e5b968" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="190.2" cy="229.0" r="1.5" fill="#e5b968"/><text x="245.0" y="239.1" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.5" fill="#e5b968" font-weight="600">0.5 oz</tspan> <tspan fill="#c7b9ab">Blanc vermouth</tspan></text></g><g class="spec-svg-callout"><polyline points="171.2,252.9 234.0,252.9 240.0,252.9" fill="none" stroke="#d4ccc2" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="171.2" cy="252.9" r="1.5" fill="#d4ccc2"/><text x="245.0" y="255.9" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="2" fill="#d4ccc2" font-weight="600">2 oz</tspan> <tspan fill="#c7b9ab">London Dry Gin</tspan></text></g>
</svg>