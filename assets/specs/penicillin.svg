      <stop offset="0%" stop-color="#1d1511"/>
      <stop offset="65%" stop-color="#110c0a"/>
      <stop offset="100%" stop-color="#090605"/>
    </radialGradient>
    <clipPath id="glass-clip-archive-penicillin">
      <path d="M 78.0 184.0 L 99.0 346.0 L 205.0 346.0 L 226.0 184.0 Z"/>
    </clipPath>
    <mask id="ice-mask-archive-penicillin">
      <rect x="0" y="0" width="420" height="460" fill="white"/>
      <rect x="96.3" y="223.9" width="66.0" height="68.0" rx="1.5" fill="black"/>
    </mask>
    <pattern id="pat-archive-penicillin-0" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e08c38" fill-opacity="0.11"/><line x1="2" y1="1.5" x2="2" y2="6.5" stroke="#e08c38" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="5.5" y1="1.5" x2="5.5" y2="6.5" stroke="#e08c38" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="2" y1="4" x2="5.5" y2="4" stroke="#e08c38" stroke-width="0.9" stroke-opacity="0.55"/></pattern>
<pattern id="pat-archive-penicillin-1" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e8c86b" fill-opacity="0.10"/><line x1="1.5" y1="5.5" x2="5.5" y2="1.5" stroke="#e8c86b" stroke-width="1.1" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-penicillin-2" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#d68a3e" fill-opacity="0.12"/><line x1="1.5" y1="2" x2="5.5" y2="2" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.85" stroke-linecap="round"/><line x1="5.5" y1="5" x2="9" y2="5" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.85" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-penicillin-3" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#d68a3e" fill-opacity="0.11"/><line x1="2" y1="1.5" x2="2" y2="6.5" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="5.5" y1="1.5" x2="5.5" y2="6.5" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="2" y1="4" x2="5.5" y2="4" stroke="#d68a3e" stroke-width="0.9" stroke-opacity="0.55"/></pattern>
<pattern id="pat-archive-penicillin-4" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e08c38" fill-opacity="0.09"/><circle cx="2" cy="2" r="1.15" fill="#e08c38" fill-opacity="0.85"/><circle cx="5.5" cy="5.5" r="1.15" fill="#e08c38" fill-opacity="0.85"/></pattern>
  </defs>

  <!-- Speakeasy Blueprint Canvas -->
