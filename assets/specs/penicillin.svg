0.0,315.2" fill="none" stroke="#e08c38" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="213.0" cy="315.2" r="1.5" fill="#e08c38"/><text x="245.0" y="318.2" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="2" fill="#e08c38" font-weight="600">2 oz</tspan> <tspan fill="#c7b9ab">Blended Scotch</tspan></text></g>
</svg>