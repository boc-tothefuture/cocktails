  <rect x="14" y="14" width="392" height="432" rx="8" fill="none" stroke="#e8c59e" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Proportional Patterned Liquid Layers (Clipped to Glass & Masked Around Ice) -->
  <g clip-path="url(#glass-clip-archive-penicillin)">
    <g mask="url(#ice-mask-archive-penicillin)">
      <rect x="40" y="284.44" width="240" height="61.56" fill="url(#pat-archive-penicillin-0)"/><line x1="40" y1="284.44" x2="280" y2="284.44" stroke="#e08c38" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="261.36" width="240" height="23.09" fill="url(#pat-archive-penicillin-1)"/><line x1="40" y1="261.36" x2="280" y2="261.36" stroke="#e8c86b" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="245.97" width="240" height="15.39" fill="url(#pat-archive-penicillin-2)"/><line x1="40" y1="245.97" x2="280" y2="245.97" stroke="#d68a3e" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="230.58" width="240" height="15.39" fill="url(#pat-archive-penicillin-3)"/><line x1="40" y1="230.58" x2="280" y2="230.58" stroke="#d68a3e" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="222.88" width="240" height="7.70" fill="url(#pat-archive-penicillin-4)"/><line x1="40" y1="222.88" x2="280" y2="222.88" stroke="#e08c38" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    <rect x="96.3" y="223.9" width="66.0" height="68.0" rx="1.5" fill="#110c0a" fill-opacity="0.25" stroke="#dfd2c0" stroke-width="0.9" stroke-opacity="0.22"/>
  </g>

  <!-- Minimalist Open-Top Glass Silhouette -->
  <path d="M 77.0 184.0 L 98.0 347.0 Q 98.0 351.0 103.0 351.0 L 201.0 351.0 Q 206.0 351.0 206.0 347.0 L 227.0 184.0" fill="none" stroke="#d8c7b4" stroke-width="2" stroke-linecap="round"/>

  <!-- Garnish, Bitters Droplets & Botanical Accents -->
  

  <!-- Proportional Layer Callouts -->
