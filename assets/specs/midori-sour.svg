<pattern id="pat-archive-midori-sour-2" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e8c86b" fill-opacity="0.10"/><line x1="1.5" y1="5.5" x2="5.5" y2="1.5" stroke="#e8c86b" stroke-width="1.1" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-midori-sour-3" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#82b078" fill-opacity="0.09"/><circle cx="2" cy="2" r="1.15" fill="#82b078" fill-opacity="0.85"/><circle cx="5.5" cy="5.5" r="1.15" fill="#82b078" fill-opacity="0.85"/></pattern>
<pattern id="pat-archive-midori-sour-4" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#f2e6d8" fill-opacity="0.18"/><circle cx="1.5" cy="1.5" r="0.9" fill="#f2e6d8" fill-opacity="0.9"/><circle cx="4" cy="3.8" r="0.75" fill="#f2e6d8" fill-opacity="0.75"/></pattern>
  </defs>

