 240.0,264.4" fill="none" stroke="#82b078" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="179.1" cy="257.2" r="1.5" fill="#82b078"/><text x="245.0" y="267.4" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1" fill="#82b078" font-weight="600">1 oz</tspan> <tspan fill="#c7b9ab">Midori Melon Liqueur</tspan></text></g>
</svg>