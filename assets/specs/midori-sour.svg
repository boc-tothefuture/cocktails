    <g mask="url(#ice-mask-archive-midori-sour)">
      <rect x="40" y="248.45" width="240" height="17.55" fill="url(#pat-archive-midori-sour-0)"/><line x1="40" y1="248.45" x2="280" y2="248.45" stroke="#82b078" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="230.90" width="240" height="17.55" fill="url(#pat-archive-midori-sour-1)"/><line x1="40" y1="230.90" x2="280" y2="230.90" stroke="#d4ccc2" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="217.74" width="240" height="13.16" fill="url(#pat-archive-midori-sour-2)"/><line x1="40" y1="217.74" x2="280" y2="217.74" stroke="#e8c86b" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="208.96" width="240" height="8.78" fill="url(#pat-archive-midori-sour-3)"/><line x1="40" y1="208.96" x2="280" y2="208.96" stroke="#82b078" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="195.80" width="240" height="13.16" fill="url(#pat-archive-midori-sour-4)"/><line x1="40" y1="195.80" x2="280" y2="195.80" stroke="#f2e6d8" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    
  </g>

