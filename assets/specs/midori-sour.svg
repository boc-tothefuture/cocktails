  <g fill="none" stroke="#e8993a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="M 110.0 166.0 C 110.0 188.0, 144.0 190.0, 146.0 166.0 C 148.0 148.0, 126.0 148.0, 128.0 168.0 C 130.0 190.0, 174.0 190.0, 176.0 168.0 C 178.0 150.0, 158.0 150.0, 160.0 170.0 C 162.0 188.0, 192.0 186.0, 198.0 168.0"/><path d="M 114.0 166.0 C 114.0 184.0, 140.0 186.0, 142.0 166.0" stroke-opacity="0.55" stroke-width="1.0"/></g>

