<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="100%" height="100%" class="cocktail-spec-svg" role="img" aria-label="Spaghett proportional build diagram">
  <defs>
    <radialGradient id="bg-glow-archive-spaghett" cx="38%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#1d1511"/>
      <stop offset="65%" stop-color="#110c0a"/>
      <stop offset="100%" stop-color="#090605"/>
    </radialGradient>
    <clipPath id="glass-clip-archive-spaghett">
      <path d="M 136.0 132.0 L 134.0 190 C 134.0 218, 108.0 230, 108.0 256 L 108.0 350.0 L 196.0 350.0 L 196.0 256 C 196.0 230, 170.0 218, 170.0 190 L 168.0 132.0 Z"/>
    </clipPath>
    <mask id="ice-mask-archive-spaghett">
      <rect x="0" y="0" width="420" height="460" fill="white"/>
      
    </mask>
    <pattern id="pat-archive-spaghett-0" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#dfd2c0" fill-opacity="0.07"/><circle cx="3.5" cy="8.5" r="1.7" fill="none" stroke="#dfd2c0" stroke-width="0.95" stroke-opacity="0.78"/><circle cx="9" cy="4" r="1.2" fill="none" stroke="#dfd2c0" stroke-width="0.9" stroke-opacity="0.7"/><circle cx="6.5" cy="10.5" r="0.7" fill="#dfd2c0" fill-opacity="0.65"/></pattern>
<pattern id="pat-archive-spaghett-1" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#d16647" fill-opacity="0.12"/><path d="M4 1.8V6.2M1.8 4H6.2" stroke="#d16647" stroke-width="1.05" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-spaghett-2" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e8c86b" fill-opacity="0.10"/><line x1="1.5" y1="5.5" x2="5.5" y2="1.5" stroke="#e8c86b" stroke-width="1.1" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
  </defs>

  <!-- Speakeasy Blueprint Canvas -->
  <rect width="420" height="460" fill="url(#bg-glow-archive-spaghett)"/>
  <rect x="14" y="14" width="392" height="432" rx="8" fill="none" stroke="#e8c59e" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Proportional Patterned Liquid Layers (Clipped to Glass & Masked Around Ice) -->
  <g clip-path="url(#glass-clip-archive-spaghett)">
    <g mask="url(#ice-mask-archive-spaghett)">
      <rect x="40" y="197.40" width="240" height="152.60" fill="url(#pat-archive-spaghett-0)"/><line x1="40" y1="197.40" x2="280" y2="197.40" stroke="#dfd2c0" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="174.51" width="240" height="22.89" fill="url(#pat-archive-spaghett-1)"/><line x1="40" y1="174.51" x2="280" y2="174.51" stroke="#d16647" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="166.88" width="240" height="7.63" fill="url(#pat-archive-spaghett-2)"/><line x1="40" y1="166.88" x2="280" y2="166.88" stroke="#e8c86b" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    
  </g>

  <!-- Minimalist Open-Top Glass Silhouette -->
  <path d="M 135.0 132.0 L 133.0 190 C 133.0 218, 107.0 230, 107.0 256 L 107.0 350.0 Q 107.0 354.0 112.0 354.0 L 192.0 354.0 Q 197.0 354.0 197.0 350.0 L 197.0 256 C 197.0 230, 171.0 218, 171.0 190 L 169.0 132.0" fill="none" stroke="#d8c7b4" stroke-width="2" stroke-linecap="round"/>

  <!-- Garnish, Bitters Droplets & Botanical Accents -->
  <g><circle cx="160.0" cy="164.9" r="16" fill="#120d0b" stroke="#e8c86b" stroke-width="1.5"/><circle cx="160.0" cy="164.9" r="13" fill="none" stroke="#e8c86b" stroke-width="0.8" stroke-opacity="0.6"/><line x1="160.0" y1="164.9" x2="175.0" y2="164.9" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="164.9" x2="170.6" y2="175.5" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="164.9" x2="160.0" y2="179.9" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="164.9" x2="149.4" y2="175.5" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="164.9" x2="145.0" y2="164.9" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="164.9" x2="149.4" y2="154.3" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="164.9" x2="160.0" y2="149.9" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="164.9" x2="170.6" y2="154.3" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.7"/></g>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="173.0,170.7 234.0,170.7 240.0,170.7" fill="none" stroke="#e8c86b" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="173.0" cy="170.7" r="1.5" fill="#e8c86b"/><text x="245.0" y="173.7" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.5" fill="#e8c86b" font-weight="600">0.5 oz</tspan> <tspan fill="#c7b9ab">Fresh lemon juice</tspan></text></g><g class="spec-svg-callout"><polyline points="173.0,186.0 234.0,186.2 240.0,186.2" fill="none" stroke="#d16647" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="173.0" cy="186.0" r="1.5" fill="#d16647"/><text x="245.0" y="189.2" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1.5" fill="#d16647" font-weight="600">1.5 oz</tspan> <tspan fill="#c7b9ab">Aperol</tspan></text></g><g class="spec-svg-callout"><polyline points="200.0,273.7 234.0,273.7 240.0,273.7" fill="none" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="200.0" cy="273.7" r="1.5" fill="#dfd2c0"/><text x="245.0" y="276.7" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="10" fill="#dfd2c0" font-weight="600">10 oz</tspan> <tspan fill="#c7b9ab">Miller High Life</tspan></text></g>
</svg>