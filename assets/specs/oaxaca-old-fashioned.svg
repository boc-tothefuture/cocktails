  <g clip-path="url(#glass-clip-archive-oaxaca-old-fashioned)">
    <g mask="url(#ice-mask-archive-oaxaca-old-fashioned)">
      <rect x="40" y="259.09" width="240" height="86.91" fill="url(#pat-archive-oaxaca-old-fashioned-0)"/><line x1="40" y1="259.09" x2="280" y2="259.09" stroke="#e2a44c" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="230.12" width="240" height="28.97" fill="url(#pat-archive-oaxaca-old-fashioned-1)"/><line x1="40" y1="230.12" x2="280" y2="230.12" stroke="#e2a44c" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="222.88" width="240" height="7.24" fill="url(#pat-archive-oaxaca-old-fashioned-2)"/><line x1="40" y1="222.88" x2="280" y2="222.88" stroke="#d68a3e" stroke-width="1.1" stroke-opacity="0.7"/>
