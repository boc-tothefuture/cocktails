    </mask>
    <pattern id="pat-archive-oaxaca-old-fashioned-0" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e2a44c" fill-opacity="0.11"/><path d="M1.5 6L4 2L6.5 6" fill="none" stroke="#e2a44c" stroke-width="1.05" stroke-opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/></pattern>
<pattern id="pat-archive-oaxaca-old-fashioned-1" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e2a44c" fill-opacity="0.11"/><line x1="2" y1="1.5" x2="2" y2="6.5" stroke="#e2a44c" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="5.5" y1="1.5" x2="5.5" y2="6.5" stroke="#e2a44c" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="2" y1="4" x2="5.5" y2="4" stroke="#e2a44c" stroke-width="0.9" stroke-opacity="0.55"/></pattern>
<pattern id="pat-archive-oaxaca-old-fashioned-2" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#d68a3e" fill-opacity="0.12"/><line x1="1.5" y1="2" x2="5.5" y2="2" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.85" stroke-linecap="round"/><line x1="5.5" y1="5" x2="9" y2="5" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.85" stroke-linecap="round"/></pattern>
