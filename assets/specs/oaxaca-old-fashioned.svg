<path d="M 205.0 192.5 C 208.5 197.0, 208.5 201.0, 205.0 201.0 C 201.5 201.0, 201.5 197.0, 205.0 192.5 Z" fill="none" stroke="#d9783a" stroke-width="1.35"/>
<g fill="none" stroke="#e8993a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="M 110.0 174.0 C 110.0 196.0, 144.0 198.0, 146.0 174.0 C 148.0 156.0, 126.0 156.0, 128.0 176.0 C 130.0 198.0, 174.0 198.0, 176.0 176.0 C 178.0 158.0, 158.0 158.0, 160.0 178.0 C 162.0 196.0, 192.0 194.0, 198.0 176.0"/><path d="M 114.0 174.0 C 114.0 192.0, 140.0 194.0, 142.0 174.0" stroke-opacity="0.55" stroke-width="1.0"/></g>

