<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="100%" height="100%" class="cocktail-spec-svg" role="img" aria-label="Aviation proportional build diagram">
  <defs>
    <radialGradient id="bg-glow-archive-aviation" cx="38%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#1d1511"/>
      <stop offset="65%" stop-color="#110c0a"/>
      <stop offset="100%" stop-color="#090605"/>
    </radialGradient>
    <clipPath id="glass-clip-archive-aviation">
      <path d="M 78.0 176.0 C 78.0 228.0, 110.0 266.0, 152.0 266.0 C 194.0 266.0, 226.0 228.0, 226.0 176.0 Z"/>
    </clipPath>
    <mask id="ice-mask-archive-aviation">
      <rect x="0" y="0" width="420" height="460" fill="white"/>
      
    </mask>
    <pattern id="pat-archive-aviation-0" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#d4ccc2" fill-opacity="0.09"/><circle cx="2" cy="2" r="1.15" fill="#d4ccc2" fill-opacity="0.85"/><circle cx="5.5" cy="5.5" r="1.15" fill="#d4ccc2" fill-opacity="0.85"/></pattern>
<pattern id="pat-archive-aviation-1" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e5b968" fill-opacity="0.11"/><line x1="2" y1="1.5" x2="2" y2="6.5" stroke="#e5b968" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="5.5" y1="1.5" x2="5.5" y2="6.5" stroke="#e5b968" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="2" y1="4" x2="5.5" y2="4" stroke="#e5b968" stroke-width="0.9" stroke-opacity="0.55"/></pattern>
<pattern id="pat-archive-aviation-2" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e8c86b" fill-opacity="0.10"/><line x1="1.5" y1="5.5" x2="5.5" y2="1.5" stroke="#e8c86b" stroke-width="1.1" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-aviation-3" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#cc6668" fill-opacity="0.12"/><path d="M4 1.8V6.2M1.8 4H6.2" stroke="#cc6668" stroke-width="1.05" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
  </defs>

  <!-- Subterranean Speakeasy Blueprint Canvas -->
  <rect width="420" height="460" fill="url(#bg-glow-archive-aviation)"/>
  <rect x="14" y="14" width="392" height="432" rx="8" fill="none" stroke="#e8c59e" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Proportional Patterned Liquid Layers (Clipped to Glass & Masked Around Ice) -->
  <g clip-path="url(#glass-clip-archive-aviation)">
    <g mask="url(#ice-mask-archive-aviation)">
      <rect x="40" y="226.99" width="240" height="39.01" fill="url(#pat-archive-aviation-0)"/><line x1="40" y1="226.99" x2="280" y2="226.99" stroke="#d4ccc2" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="217.24" width="240" height="9.75" fill="url(#pat-archive-aviation-1)"/><line x1="40" y1="217.24" x2="280" y2="217.24" stroke="#e5b968" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="202.61" width="240" height="14.63" fill="url(#pat-archive-aviation-2)"/><line x1="40" y1="202.61" x2="280" y2="202.61" stroke="#e8c86b" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="195.80" width="240" height="6.81" fill="url(#pat-archive-aviation-3)"/><line x1="40" y1="195.80" x2="280" y2="195.80" stroke="#cc6668" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    
  </g>

  <!-- Minimalist Open-Top Glass Silhouette -->
  <path d="M 77.0 176.0 C 77.0 229.0, 109.0 267.0, 152.0 267.0 C 195.0 267.0, 227.0 229.0, 227.0 176.0" fill="none" stroke="#d8c7b4" stroke-width="2" stroke-linecap="round"/><line x1="152.0" y1="267.0" x2="152.0" y2="350" stroke="#d8c7b4" stroke-width="2"/><path d="M 108.0 350 L 196.0 350" stroke="#d8c7b4" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Garnish, Bitters Droplets & Botanical Accents -->
  <circle cx="152.0" cy="256.0" r="6.5" fill="#180d0d" stroke="#c95959" stroke-width="1.5"/>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="219.8,199.2 234.0,199.2 240.0,199.2" fill="none" stroke="#cc6668" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="219.8" cy="199.2" r="1.5" fill="#cc6668"/><text x="245.0" y="202.2" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.25" fill="#cc6668" font-weight="600">0.25 oz</tspan> <tspan fill="#c7b9ab">Crème de Violette</tspan></text></g><g class="spec-svg-callout"><polyline points="214.4,209.9 234.0,214.7 240.0,214.7" fill="none" stroke="#e8c86b" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="214.4" cy="209.9" r="1.5" fill="#e8c86b"/><text x="245.0" y="217.7" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.75" fill="#e8c86b" font-weight="600">0.75 oz</tspan> <tspan fill="#c7b9ab">Fresh lemon juice</tspan></text></g><g class="spec-svg-callout"><polyline points="207.7,222.1 234.0,230.2 240.0,230.2" fill="none" stroke="#e5b968" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="207.7" cy="222.1" r="1.5" fill="#e5b968"/><text x="245.0" y="233.2" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.5" fill="#e5b968" font-weight="600">0.5 oz</tspan> <tspan fill="#c7b9ab">Maraschino</tspan></text></g><g class="spec-svg-callout"><polyline points="190.4,246.5 234.0,246.5 240.0,246.5" fill="none" stroke="#d4ccc2" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="190.4" cy="246.5" r="1.5" fill="#d4ccc2"/><text x="245.0" y="249.5" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="2" fill="#d4ccc2" font-weight="600">2 oz</tspan> <tspan fill="#c7b9ab">London Dry Gin</tspan></text></g>
</svg>