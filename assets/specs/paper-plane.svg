<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="100%" height="100%" class="cocktail-spec-svg" role="img" aria-label="Paper Plane proportional build diagram">
  <defs>
    <radialGradient id="bg-glow-archive-paper-plane" cx="38%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#1d1511"/>
      <stop offset="65%" stop-color="#110c0a"/>
      <stop offset="100%" stop-color="#090605"/>
    </radialGradient>
    <clipPath id="glass-clip-archive-paper-plane">
      <path d="M 94.0 172.0 C 94.0 234.0, 120.0 270.0, 152.0 270.0 C 184.0 270.0, 210.0 234.0, 210.0 172.0 Z"/>
    </clipPath>
    <mask id="ice-mask-archive-paper-plane">
      <rect x="0" y="0" width="420" height="460" fill="white"/>
      
    </mask>
    <pattern id="pat-archive-paper-plane-0" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e08c38" fill-opacity="0.11"/><line x1="2" y1="1.5" x2="2" y2="6.5" stroke="#e08c38" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="5.5" y1="1.5" x2="5.5" y2="6.5" stroke="#e08c38" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="2" y1="4" x2="5.5" y2="4" stroke="#e08c38" stroke-width="0.9" stroke-opacity="0.55"/></pattern>
<pattern id="pat-archive-paper-plane-1" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#d89440" fill-opacity="0.09"/><circle cx="2" cy="2" r="1.15" fill="#d89440" fill-opacity="0.85"/><circle cx="5.5" cy="5.5" r="1.15" fill="#d89440" fill-opacity="0.85"/></pattern>
<pattern id="pat-archive-paper-plane-2" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#d16647" fill-opacity="0.12"/><path d="M4 1.8V6.2M1.8 4H6.2" stroke="#d16647" stroke-width="1.05" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-paper-plane-3" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e8c86b" fill-opacity="0.10"/><line x1="1.5" y1="5.5" x2="5.5" y2="1.5" stroke="#e8c86b" stroke-width="1.1" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
  </defs>

  <!-- Subterranean Speakeasy Blueprint Canvas -->
  <rect width="420" height="460" fill="url(#bg-glow-archive-paper-plane)"/>
  <rect x="14" y="14" width="392" height="432" rx="8" fill="none" stroke="#e8c59e" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Proportional Patterned Liquid Layers (Clipped to Glass & Masked Around Ice) -->
  <g clip-path="url(#glass-clip-archive-paper-plane)">
    <g mask="url(#ice-mask-archive-paper-plane)">
      <rect x="40" y="250.89" width="240" height="19.11" fill="url(#pat-archive-paper-plane-0)"/><line x1="40" y1="250.89" x2="280" y2="250.89" stroke="#e08c38" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="231.78" width="240" height="19.11" fill="url(#pat-archive-paper-plane-1)"/><line x1="40" y1="231.78" x2="280" y2="231.78" stroke="#d89440" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="212.67" width="240" height="19.11" fill="url(#pat-archive-paper-plane-2)"/><line x1="40" y1="212.67" x2="280" y2="212.67" stroke="#d16647" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="193.56" width="240" height="19.11" fill="url(#pat-archive-paper-plane-3)"/><line x1="40" y1="193.56" x2="280" y2="193.56" stroke="#e8c86b" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    
  </g>

  <!-- Minimalist Open-Top Glass Silhouette -->
  <path d="M 93.0 172.0 C 93.0 235.0, 119.0 271.0, 152.0 271.0 C 185.0 271.0, 211.0 235.0, 211.0 172.0" fill="none" stroke="#d8c7b4" stroke-width="2" stroke-linecap="round"/><line x1="152.0" y1="271.0" x2="152.0" y2="350" stroke="#d8c7b4" stroke-width="2"/><path d="M 112.0 350 L 192.0 350" stroke="#d8c7b4" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Garnish, Bitters Droplets & Botanical Accents -->
  <g fill="none" stroke="#e8c86b" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="M 110.0 162.0 C 110.0 184.0, 144.0 186.0, 146.0 162.0 C 148.0 144.0, 126.0 144.0, 128.0 164.0 C 130.0 186.0, 174.0 186.0, 176.0 164.0 C 178.0 146.0, 158.0 146.0, 160.0 166.0 C 162.0 184.0, 192.0 182.0, 198.0 164.0"/><path d="M 114.0 162.0 C 114.0 180.0, 140.0 182.0, 142.0 162.0" stroke-opacity="0.55" stroke-width="1.0"/></g>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="204.8,203.1 234.0,203.1 240.0,203.1" fill="none" stroke="#e8c86b" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="204.8" cy="203.1" r="1.5" fill="#e8c86b"/><text x="245.0" y="206.1" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1" fill="#e8c86b" font-weight="600">1 oz</tspan> <tspan fill="#c7b9ab">Fresh lemon juice</tspan></text></g><g class="spec-svg-callout"><polyline points="198.0,222.2 234.0,222.2 240.0,222.2" fill="none" stroke="#d16647" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="198.0" cy="222.2" r="1.5" fill="#d16647"/><text x="245.0" y="225.2" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1" fill="#d16647" font-weight="600">1 oz</tspan> <tspan fill="#c7b9ab">Aperol Aperitivo</tspan></text></g><g class="spec-svg-callout"><polyline points="189.4,241.3 234.0,241.3 240.0,241.3" fill="none" stroke="#d89440" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="189.4" cy="241.3" r="1.5" fill="#d89440"/><text x="245.0" y="244.3" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1" fill="#d89440" font-weight="600">1 oz</tspan> <tspan fill="#c7b9ab">Amaro Nonino</tspan></text></g><g class="spec-svg-callout"><polyline points="176.3,260.4 234.0,260.4 240.0,260.4" fill="none" stroke="#e08c38" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="176.3" cy="260.4" r="1.5" fill="#e08c38"/><text x="245.0" y="263.4" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1" fill="#e08c38" font-weight="600">1 oz</tspan> <tspan fill="#c7b9ab">Bourbon Whiskey</tspan></text></g>
</svg>