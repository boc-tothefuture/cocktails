<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="100%" height="100%" class="cocktail-spec-svg" role="img" aria-label="The Canadian Cocktail proportional build diagram">
  <defs>
    <radialGradient id="bg-glow-archive-the-canadian-cocktail" cx="38%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#1d1511"/>
      <stop offset="65%" stop-color="#110c0a"/>
      <stop offset="100%" stop-color="#090605"/>
    </radialGradient>
    <clipPath id="glass-clip-archive-the-canadian-cocktail">
      <path d="M 78.0 184.0 L 99.0 346.0 L 205.0 346.0 L 226.0 184.0 Z"/>
    </clipPath>
    <mask id="ice-mask-archive-the-canadian-cocktail">
      <rect x="0" y="0" width="420" height="460" fill="white"/>
      <rect x="95.8" y="219.4" width="42.0" height="42.0" rx="1.5" transform="rotate(-5 116.8 240.4)" fill="black"/><rect x="105.8" y="265.4" width="38.0" height="38.0" rx="1.5" transform="rotate(7 124.8 284.4)" fill="black"/>
    </mask>
    <pattern id="pat-archive-the-canadian-cocktail-0" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e08c38" fill-opacity="0.11"/><line x1="2" y1="1.5" x2="2" y2="6.5" stroke="#e08c38" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="5.5" y1="1.5" x2="5.5" y2="6.5" stroke="#e08c38" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="2" y1="4" x2="5.5" y2="4" stroke="#e08c38" stroke-width="0.9" stroke-opacity="0.55"/></pattern>
<pattern id="pat-archive-the-canadian-cocktail-1" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#d68a3e" fill-opacity="0.12"/><line x1="1.5" y1="2" x2="5.5" y2="2" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.85" stroke-linecap="round"/><line x1="5.5" y1="5" x2="9" y2="5" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.85" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-the-canadian-cocktail-2" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e8c86b" fill-opacity="0.10"/><line x1="1.5" y1="5.5" x2="5.5" y2="1.5" stroke="#e8c86b" stroke-width="1.1" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-the-canadian-cocktail-3" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e8c86b" fill-opacity="0.11"/><line x1="2" y1="1.5" x2="2" y2="6.5" stroke="#e8c86b" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="5.5" y1="1.5" x2="5.5" y2="6.5" stroke="#e8c86b" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="2" y1="4" x2="5.5" y2="4" stroke="#e8c86b" stroke-width="0.9" stroke-opacity="0.55"/></pattern>
  </defs>

  <!-- Speakeasy Blueprint Canvas -->
  <rect width="420" height="460" fill="url(#bg-glow-archive-the-canadian-cocktail)"/>
  <rect x="14" y="14" width="392" height="432" rx="8" fill="none" stroke="#e8c59e" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Proportional Patterned Liquid Layers (Clipped to Glass & Masked Around Ice) -->
  <g clip-path="url(#glass-clip-archive-the-canadian-cocktail)">
    <g mask="url(#ice-mask-archive-the-canadian-cocktail)">
      <rect x="40" y="259.60" width="240" height="86.40" fill="url(#pat-archive-the-canadian-cocktail-0)"/><line x1="40" y1="259.60" x2="280" y2="259.60" stroke="#e08c38" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="238.00" width="240" height="21.60" fill="url(#pat-archive-the-canadian-cocktail-1)"/><line x1="40" y1="238.00" x2="280" y2="238.00" stroke="#d68a3e" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="227.20" width="240" height="10.80" fill="url(#pat-archive-the-canadian-cocktail-2)"/><line x1="40" y1="227.20" x2="280" y2="227.20" stroke="#e8c86b" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="216.40" width="240" height="10.80" fill="url(#pat-archive-the-canadian-cocktail-3)"/><line x1="40" y1="216.40" x2="280" y2="216.40" stroke="#e8c86b" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    <rect x="95.8" y="219.4" width="42.0" height="42.0" rx="1.5" transform="rotate(-5 116.8 240.4)" fill="#110c0a" fill-opacity="0.25" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.22"/><rect x="105.8" y="265.4" width="38.0" height="38.0" rx="1.5" transform="rotate(7 124.8 284.4)" fill="#110c0a" fill-opacity="0.25" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.22"/>
  </g>

  <!-- Minimalist Open-Top Glass Silhouette -->
  <path d="M 77.0 184.0 L 98.0 347.0 Q 98.0 351.0 103.0 351.0 L 201.0 351.0 Q 206.0 351.0 206.0 347.0 L 227.0 184.0" fill="none" stroke="#d8c7b4" stroke-width="2" stroke-linecap="round"/>

  <!-- Garnish, Bitters Droplets & Botanical Accents -->
  <g transform="translate(172.0, 202.4) rotate(18)"><rect x="-3.5" y="-22" width="7" height="48" rx="2" fill="#14100e" stroke="#c87638" stroke-width="1.4"/><line x1="-1" y1="-18" x2="-1" y2="20" stroke="#c87638" stroke-width="0.8" stroke-opacity="0.6"/></g>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="225.1,221.8 234.0,221.8 240.0,221.8" fill="none" stroke="#e8c86b" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="225.1" cy="221.8" r="1.5" fill="#e8c86b"/><text x="245.0" y="224.8" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.25" fill="#e8c86b" font-weight="600">0.25 oz</tspan> <tspan fill="#c7b9ab">Crisp apple cider</tspan></text></g><g class="spec-svg-callout"><polyline points="223.7,232.6 234.0,237.3 240.0,237.3" fill="none" stroke="#e8c86b" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="223.7" cy="232.6" r="1.5" fill="#e8c86b"/><text x="245.0" y="240.3" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.25" fill="#e8c86b" font-weight="600">0.25 oz</tspan> <tspan fill="#c7b9ab">Fresh lime juice</tspan></text></g><g class="spec-svg-callout"><polyline points="221.6,248.8 234.0,252.8 240.0,252.8" fill="none" stroke="#d68a3e" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="221.6" cy="248.8" r="1.5" fill="#d68a3e"/><text x="245.0" y="255.8" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.5" fill="#d68a3e" font-weight="600">0.5 oz</tspan> <tspan fill="#c7b9ab">Pure Maple Syrup</tspan></text></g><g class="spec-svg-callout"><polyline points="214.6,302.8 234.0,302.8 240.0,302.8" fill="none" stroke="#e08c38" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="214.6" cy="302.8" r="1.5" fill="#e08c38"/><text x="245.0" y="305.8" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="2" fill="#e08c38" font-weight="600">2 oz</tspan> <tspan fill="#c7b9ab">Spiced Rum</tspan></text></g>
</svg>