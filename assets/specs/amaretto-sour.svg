fill="none" stroke="#e5b968" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="212.0" cy="322.9" r="1.5" fill="#e5b968"/><text x="245.0" y="325.9" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1.5" fill="#e5b968" font-weight="600">1.5 oz</tspan> <tspan fill="#c7b9ab">Lazzaroni Amaretto</tspan></text></g>
