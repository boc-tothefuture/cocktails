<path d="M 205.8 189.9 C 209.3 194.4, 209.3 198.4, 205.8 198.4 C 202.3 198.4, 202.3 194.4, 205.8 189.9 Z" fill="none" stroke="#d65a4a" stroke-width="1.35"/>
<g><circle cx="160.0" cy="214.4" r="16" fill="#120d0b" stroke="#df7362" stroke-width="1.5"/><circle cx="160.0" cy="214.4" r="13" fill="none" stroke="#df7362" stroke-width="0.8" stroke-opacity="0.6"/><line x1="160.0" y1="214.4" x2="175.0" y2="214.4" stroke="#df7362" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="170.6" y2="225.0" stroke="#df7362" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="160.0" y2="229.4" stroke="#df7362" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="149.4" y2="225.0" stroke="#df7362" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="145.0" y2="214.4" stroke="#df7362" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="149.4" y2="203.8" stroke="#df7362" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="160.0" y2="199.4" stroke="#df7362" stroke-width="0.9" stroke-opacity="0.7"/><line x1="160.0" y1="214.4" x2="170.6" y2="203.8" stroke="#df7362" stroke-width="0.9" stroke-opacity="0.7"/></g>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="223.7,232.6 234.0,232.6 240.0,232.6" fill="none" stroke="#e5b968" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="223.7" cy="232.6" r="1.5" fill="#e5b968"/><text x="245.0" y="235.6" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1" fill="#e5b968" font-weight="600">1 oz</tspan> <tspan fill="#c7b9ab">Bénédictine D.O.M.</tspan></text></g><g class="spec-svg-callout"><polyline points="219.5,265.0 234.0,265.0 240.0,265.0" fill="none" stroke="#e2a44c" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="219.5" cy="265.0" r="1.5" fill="#e2a44c"/><text x="245.0" y="268.0" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1" fill="#e2a44c" font-weight="600">1 oz</tspan> <tspan fill="#c7b9ab">Artisanal mezcal</tspan></text></g><g class="spec-svg-callout"><polyline points="213.2,313.6 234.0,313.6 240.0,313.6" fill="none" stroke="#e08c38" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="213.2" cy="313.6" r="1.5" fill="#e08c38"/><text x="245.0" y="316.6" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="2" fill="#e08c38" font-weight="600">2 oz</tspan> <tspan fill="#c7b9ab">Pot Still Irish</tspan></text></g>
</svg>