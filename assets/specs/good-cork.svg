      <rect x="95.8" y="219.4" width="42.0" height="42.0" rx="1.5" transform="rotate(-5 116.8 240.4)" fill="black"/><rect x="105.8" y="265.4" width="38.0" height="38.0" rx="1.5" transform="rotate(7 124.8 284.4)" fill="black"/>
    </mask>
    <pattern id="pat-archive-good-cork-0" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e08c38" fill-opacity="0.11"/><line x1="2" y1="1.5" x2="2" y2="6.5" stroke="#e08c38" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="5.5" y1="1.5" x2="5.5" y2="6.5" stroke="#e08c38" stroke-width="1.15" stroke-opacity="0.82" stroke-linecap="round"/><line x1="2" y1="4" x2="5.5" y2="4" stroke="#e08c38" stroke-width="0.9" stroke-opacity="0.55"/></pattern>
<pattern id="pat-archive-good-cork-1" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e2a44c" fill-opacity="0.11"/><path d="M1.5 6L4 2L6.5 6" fill="none" stroke="#e2a44c" stroke-width="1.05" stroke-opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/></pattern>
<pattern id="pat-archive-good-cork-2" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e5b968" fill-opacity="0.09"/><circle cx="2" cy="2" r="1.15" fill="#e5b968" fill-opacity="0.85"/><circle cx="5.5" cy="5.5" r="1.15" fill="#e5b968" fill-opacity="0.85"/></pattern>
  </defs>

