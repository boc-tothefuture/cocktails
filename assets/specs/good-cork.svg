  <rect x="14" y="14" width="392" height="432" rx="8" fill="none" stroke="#e8c59e" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Proportional Patterned Liquid Layers (Clipped to Glass & Masked Around Ice) -->
  <g clip-path="url(#glass-clip-archive-good-cork)">
    <g mask="url(#ice-mask-archive-good-cork)">
      <rect x="40" y="281.20" width="240" height="64.80" fill="url(#pat-archive-good-cork-0)"/><line x1="40" y1="281.20" x2="280" y2="281.20" stroke="#e08c38" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="248.80" width="240" height="32.40" fill="url(#pat-archive-good-cork-1)"/><line x1="40" y1="248.80" x2="280" y2="248.80" stroke="#e2a44c" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="216.40" width="240" height="32.40" fill="url(#pat-archive-good-cork-2)"/><line x1="40" y1="216.40" x2="280" y2="216.40" stroke="#e5b968" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    <rect x="95.8" y="219.4" width="42.0" height="42.0" rx="1.5" transform="rotate(-5 116.8 240.4)" fill="#110c0a" fill-opacity="0.25" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.22"/><rect x="105.8" y="265.4" width="38.0" height="38.0" rx="1.5" transform="rotate(7 124.8 284.4)" fill="#110c0a" fill-opacity="0.25" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.22"/>
  </g>

