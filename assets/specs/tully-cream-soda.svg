    <g mask="url(#ice-mask-archive-tully-cream-soda)">
      <rect x="40" y="278.63" width="240" height="67.37" fill="url(#pat-archive-tully-cream-soda-0)"/><line x1="40" y1="278.63" x2="280" y2="278.63" stroke="#e08c38" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="261.79" width="240" height="16.84" fill="url(#pat-archive-tully-cream-soda-1)"/><line x1="40" y1="261.79" x2="280" y2="261.79" stroke="#d68a3e" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="253.37" width="240" height="8.42" fill="url(#pat-archive-tully-cream-soda-2)"/><line x1="40" y1="253.37" x2="280" y2="253.37" stroke="#e8c86b" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="186.00" width="240" height="67.37" fill="url(#pat-archive-tully-cream-soda-3)"/><line x1="40" y1="186.00" x2="280" y2="186.00" stroke="#dfd2c0" stroke-width="1.1" stroke-opacity="0.7"/>
