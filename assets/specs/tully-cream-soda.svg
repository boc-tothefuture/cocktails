  </g>

  <!-- Minimalist Open-Top Glass Silhouette -->
  <path d="M 97.0 146.0 L 107.0 348.0 Q 107.0 352.0 112.0 352.0 L 192.0 352.0 Q 197.0 352.0 197.0 348.0 L 207.0 146.0" fill="none" stroke="#d8c7b4" stroke-width="2" stroke-linecap="round"/>

