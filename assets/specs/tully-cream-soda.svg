      <rect x="112.0" y="189.0" width="42.0" height="42.0" rx="1.5" transform="rotate(-5 133.0 210.0)" fill="black"/><rect x="122.0" y="235.0" width="38.0" height="38.0" rx="1.5" transform="rotate(7 141.0 254.0)" fill="black"/>
