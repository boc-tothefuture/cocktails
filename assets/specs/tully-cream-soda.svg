<pattern id="pat-archive-tully-cream-soda-3" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#dfd2c0" fill-opacity="0.07"/><circle cx="3.5" cy="8.5" r="1.7" fill="none" stroke="#dfd2c0" stroke-width="0.95" stroke-opacity="0.78"/><circle cx="9" cy="4" r="1.2" fill="none" stroke="#dfd2c0" stroke-width="0.9" stroke-opacity="0.7"/><circle cx="6.5" cy="10.5" r="0.7" fill="#dfd2c0" fill-opacity="0.65"/></pattern>
