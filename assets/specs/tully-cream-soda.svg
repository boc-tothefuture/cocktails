<pattern id="pat-archive-tully-cream-soda-1" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#d68a3e" fill-opacity="0.12"/><line x1="1.5" y1="2" x2="5.5" y2="2" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.85" stroke-linecap="round"/><line x1="5.5" y1="5" x2="9" y2="5" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.85" stroke-linecap="round"/></pattern>
