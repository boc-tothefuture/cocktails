  <g fill="none" stroke="#e8c86b" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="M 110.0 136.0 C 110.0 158.0, 144.0 160.0, 146.0 136.0 C 148.0 118.0, 126.0 118.0, 128.0 138.0 C 130.0 160.0, 174.0 160.0, 176.0 138.0 C 178.0 120.0, 158.0 120.0, 160.0 140.0 C 162.0 158.0, 192.0 156.0, 198.0 138.0"/><path d="M 114.0 136.0 C 114.0 154.0, 140.0 156.0, 142.0 136.0" stroke-opacity="0.55" stroke-width="1.0"/></g>

