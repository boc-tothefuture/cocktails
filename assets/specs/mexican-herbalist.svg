<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="100%" height="100%" class="cocktail-spec-svg" role="img" aria-label="Mexican Herbalist proportional build diagram">
  <defs>
    <radialGradient id="bg-glow-archive-mexican-herbalist" cx="38%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#1d1511"/>
      <stop offset="65%" stop-color="#110c0a"/>
      <stop offset="100%" stop-color="#090605"/>
    </radialGradient>
    <clipPath id="glass-clip-archive-mexican-herbalist">
      <path d="M 78.0 184.0 L 99.0 346.0 L 205.0 346.0 L 226.0 184.0 Z"/>
    </clipPath>
    <mask id="ice-mask-archive-mexican-herbalist">
      <rect x="0" y="0" width="420" height="460" fill="white"/>
      <rect x="95.8" y="219.4" width="42.0" height="42.0" rx="1.5" transform="rotate(-5 116.8 240.4)" fill="black"/><rect x="105.8" y="265.4" width="38.0" height="38.0" rx="1.5" transform="rotate(7 124.8 284.4)" fill="black"/>
    </mask>
    <pattern id="pat-archive-mexican-herbalist-0" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e2a44c" fill-opacity="0.11"/><path d="M1.5 6L4 2L6.5 6" fill="none" stroke="#e2a44c" stroke-width="1.05" stroke-opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/></pattern>
<pattern id="pat-archive-mexican-herbalist-1" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#cc5c58" fill-opacity="0.12"/><path d="M4 1.8V6.2M1.8 4H6.2" stroke="#cc5c58" stroke-width="1.05" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-mexican-herbalist-2" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e8c86b" fill-opacity="0.10"/><line x1="1.5" y1="5.5" x2="5.5" y2="1.5" stroke="#e8c86b" stroke-width="1.1" stroke-opacity="0.82" stroke-linecap="round"/></pattern>
<pattern id="pat-archive-mexican-herbalist-3" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#d68a3e" fill-opacity="0.12"/><line x1="1.5" y1="2" x2="5.5" y2="2" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.85" stroke-linecap="round"/><line x1="5.5" y1="5" x2="9" y2="5" stroke="#d68a3e" stroke-width="1.15" stroke-opacity="0.85" stroke-linecap="round"/></pattern>
  </defs>

  <!-- Subterranean Speakeasy Blueprint Canvas -->
  <rect width="420" height="460" fill="url(#bg-glow-archive-mexican-herbalist)"/>
  <rect x="14" y="14" width="392" height="432" rx="8" fill="none" stroke="#e8c59e" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Proportional Patterned Liquid Layers (Clipped to Glass & Masked Around Ice) -->
  <g clip-path="url(#glass-clip-archive-mexican-herbalist)">
    <g mask="url(#ice-mask-archive-mexican-herbalist)">
      <rect x="40" y="308.97" width="240" height="37.03" fill="url(#pat-archive-mexican-herbalist-0)"/><line x1="40" y1="308.97" x2="280" y2="308.97" stroke="#e2a44c" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="271.94" width="240" height="37.03" fill="url(#pat-archive-mexican-herbalist-1)"/><line x1="40" y1="271.94" x2="280" y2="271.94" stroke="#cc5c58" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="244.17" width="240" height="27.77" fill="url(#pat-archive-mexican-herbalist-2)"/><line x1="40" y1="244.17" x2="280" y2="244.17" stroke="#e8c86b" stroke-width="0.7" stroke-opacity="0.45" stroke-dasharray="2 2"/><rect x="40" y="216.40" width="240" height="27.77" fill="url(#pat-archive-mexican-herbalist-3)"/><line x1="40" y1="216.40" x2="280" y2="216.40" stroke="#d68a3e" stroke-width="1.1" stroke-opacity="0.7"/>
    </g>
    <rect x="95.8" y="219.4" width="42.0" height="42.0" rx="1.5" transform="rotate(-5 116.8 240.4)" fill="#110c0a" fill-opacity="0.25" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.22"/><rect x="105.8" y="265.4" width="38.0" height="38.0" rx="1.5" transform="rotate(7 124.8 284.4)" fill="#110c0a" fill-opacity="0.25" stroke="#dfd2c0" stroke-width="0.85" stroke-opacity="0.22"/>
  </g>

  <!-- Minimalist Open-Top Glass Silhouette -->
  <path d="M 77.0 184.0 L 98.0 347.0 Q 98.0 351.0 103.0 351.0 L 201.0 351.0 Q 206.0 351.0 206.0 347.0 L 227.0 184.0" fill="none" stroke="#d8c7b4" stroke-width="2" stroke-linecap="round"/>

  <!-- Garnish, Bitters Droplets & Botanical Accents -->
  <g fill="#120d0b" stroke="#82b078" stroke-width="1.4"><circle cx="160.0" cy="214.4" r="14"/><circle cx="160.0" cy="214.4" r="9" fill="none" stroke-dasharray="3 2"/><circle cx="157.0" cy="212.4" r="1" fill="#82b078"/><circle cx="163.0" cy="216.4" r="1" fill="#82b078"/><circle cx="162.0" cy="211.4" r="1" fill="#82b078"/></g>

  <!-- Proportional Layer Callouts -->
  <g class="spec-svg-callout"><polyline points="224.0,230.3 234.0,230.3 240.0,230.3" fill="none" stroke="#d68a3e" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="224.0" cy="230.3" r="1.5" fill="#d68a3e"/><text x="245.0" y="233.3" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.75" fill="#d68a3e" font-weight="600">0.75 oz</tspan> <tspan fill="#c7b9ab">Honey-Ginger Syrup</tspan></text></g><g class="spec-svg-callout"><polyline points="220.4,258.1 234.0,258.1 240.0,258.1" fill="none" stroke="#e8c86b" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="220.4" cy="258.1" r="1.5" fill="#e8c86b"/><text x="245.0" y="261.1" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="0.75" fill="#e8c86b" font-weight="600">0.75 oz</tspan> <tspan fill="#c7b9ab">Fresh Lime Juice</tspan></text></g><g class="spec-svg-callout"><polyline points="216.2,290.5 234.0,290.5 240.0,290.5" fill="none" stroke="#cc5c58" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="216.2" cy="290.5" r="1.5" fill="#cc5c58"/><text x="245.0" y="293.5" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1" fill="#cc5c58" font-weight="600">1 oz</tspan> <tspan fill="#c7b9ab">Jalapeño-Hibiscus</tspan></text></g><g class="spec-svg-callout"><polyline points="211.4,327.5 234.0,327.5 240.0,327.5" fill="none" stroke="#e2a44c" stroke-width="0.85" stroke-opacity="0.65"/><circle cx="211.4" cy="327.5" r="1.5" fill="#e2a44c"/><text x="245.0" y="330.5" fill="#f5efe8" font-family="'JetBrains Mono', monospace" font-size="8.2" letter-spacing="0.01em"><tspan class="spec-measure" data-oz="1" fill="#e2a44c" font-weight="600">1 oz</tspan> <tspan fill="#c7b9ab">Reposado Tequila</tspan></text></g>
</svg>